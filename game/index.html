    { t: `設備・ロボットに投資する`, d: `現金→設備へ（${yen(MGMT.capexCost)}）。生産能力↑だが減価償却が増える。`, cost: [["設備投資", "cost"], ["能力↑", "pos"]],
      go(){ m.pendCapex = MGMT.capexCost; m.lastAction = "設備投資"; mgmtRunQuarter(); return "mgmt_close"; } },
    { t: `Autolab Loop を増強する（Lv↑）`, d: `効率↑＝試薬費が下がり<em>インフレに強くなる</em>。SaaS 収入も増える。投資 ${yen(MGMT.loopUpCost)}。`, cost: [["投資", "cost"], ["効率↑↑", "pos"], ["インフレ耐性", "pos"]],
      go(){ m.pendLoop = 1; m.pendExpense += MGMT.loopUpCost; m.lastAction = "Loop増強"; mgmtRunQuarter(); return "mgmt_close"; } },
    { t: `マーケ／BD を強化する`, d: `評判・需要・SaaS購読が伸びる（${yen(MGMT.mktCost)}）。`, cost: [["マーケ費", "cost"], ["評判↑", "pos"], ["需要↑", "pos"]],
      go(){ m.pendExpense += MGMT.mktCost; m.marketingStock += 20; m.reputation = clamp(m.reputation + 6, 5, 100); m.lastAction = "マーケ"; mgmtRunQuarter(); return "mgmt_close"; } },
    { t: `創薬パイプラインを拡充する（+1）`, d: `将来のライセンス収入源を増やす（${yen(MGMT.pipeCost)}）。`, cost: [["R&D投資", "cost"], ["将来収益↑", "pos"]],
      go(){ m.pendPipe = 1; m.pendExpense += MGMT.pipeCost; m.lastAction = "パイプライン"; mgmtRunQuarter(); return "mgmt_close"; } },
    { t: `融資を受ける（+${yen(MGMT.loanAmt)}）`, d: `現金を厚くする。ただし借入は<em>金利上昇局面で利息が重くなる</em>。`, cost: [["現金+", "pos"], ["利息負担", "risk"]],
      go(){ m.pendDebt = MGMT.loanAmt; m.lastAction = "融資"; mgmtRunQuarter(); return "mgmt_close"; } },
    { t: `内部留保を厚くする（守りの一手）`, d: `今期は投資せず現金を温存。マクロ悪化前の備えに。`, cost: [["守り", "pos"]],
      go(){ m.lastAction = "守り"; mgmtRunQuarter(); return "mgmt_close"; } },
  ];
  if (m.debt > 0) ch.splice(6, 0, { t: `借入を返済する（-${yen(Math.min(m.debt, MGMT.repayAmt))}）`, d: `利息負担を軽くする。現金は減る。`, cost: [["借入-", "pos"], ["現金-", "cost"]],
      go(){ m.pendDebt = -Math.min(m.debt, MGMT.repayAmt); m.lastAction = "返済"; mgmtRunQuarter(); return "mgmt_close"; } });
  return { bare: true, badge: `経営会議 ― Q${m.quarter}`, badgeClass: "design", figure: "bars", title: "この四半期、どこに賭ける？",
    body: `${mgmtDash()}<p>一手を選ぶと四半期が締まり、決算が出る。<em>物価 ${m.cpi.toFixed(0)}・政策金利 ${m.rate.toFixed(2)}%</em> ―― 数字は静かに、しかし確実に効いてくる。</p>`,
    loop: m.rate >= 2.5 ? "金利が上がってきました。借入の利息が重くなります。Loop 効率でコストを抑えるのが定石です。"
        : m.cpi >= 110 ? "物価が上がり、人件費と試薬費が膨らんでいます。Loop 増強が効きます。"
        : "研究能力（人・設備）、収益源（パイプライン・SaaS）、効率（Loop）、資金（財務）―― バランスが要です。",
    choices: ch }; };

/* ---------- 決算：損益計算書・貸借対照表 ---------- */
SCENES.mgmt_close = () => { if (!state.mgmt) mgmtInit(); const m = state.mgmt;
  const net = m.pl ? m.pl.net : 0;
  const over = m.quarter > MGMT.maxQuarters;
  const dest = m.won ? "mgmt_win" : (m.lost ? "mgmt_bust" : (over ? "mgmt_stagnant" : "mgmt_council"));
  let note;
  if (m.won) note = `<p style="color:var(--green);font-weight:600">企業価値が目標に到達 ―― <b>大型化</b>だ。</p>`;
  else if (m.lost) note = `<p style="color:var(--warn);font-weight:600">資金が続かない ―― 経営が行き詰まった。</p>`;
  else if (m.cash < 0) note = `<p style="color:var(--warn)">現金がマイナス。次の四半期までに立て直さないと ―― 資金ショートだ。</p>`;
  else note = `<p>当期純利益 <b style="color:${net >= 0 ? 'var(--green)' : 'var(--warn)'}">${yen(net)}</b>（施策：${m.lastAction}）。会社は${net >= 0 ? '前に進んでいる' : '踏ん張りどころだ'}。</p>`;
  return { bare: true, badge: `決算 ― Q${m.quarter - 1}`, badgeClass: "analyze", figure: "bars", title: "四半期決算",
    body: `${mgmtDash()}${note}${mgmtStatement()}`,
    loop: "損益と貸借を監査 trail に記録しました。数字は嘘をつきません ―― 次の一手の根拠になります。",
    choices: [{ t: dest === "mgmt_council" ? "次の四半期の経営会議へ" : "結果を見る", cost: [[dest === "mgmt_council" ? "続行" : "…", dest === "mgmt_council" ? "pos" : "cost"]], go(){ return dest; } }] }; };

/* ---------- 経営フェーズの結末 ---------- */
function mgmtEndScreen(endId, figFn, title, verdict, color, story, win){
  if (!state.mgmt) mgmtInit();
  return { fullscreen: true, endId, confetti: !!win,
    html: `<div class="scene ending"><div class="ending-hero">${figFn()}</div><div class="ending-in">
      <div class="verdict" style="color:${color}">${verdict}</div><h2>${title}</h2><p class="story">${story}</p>
      <div class="fig" style="max-width:34rem;margin:1rem auto;text-align:left">最終企業価値 <b>${yen(mgmtValuation())}</b>／純資産 <b>${yen(mgmtEquity())}</b>／研究者 <b>${state.mgmt.staff}名</b>／Autolab Loop <b>Lv${state.mgmt.loopTier}</b>／${state.mgmt.quarter - 1} 四半期経営</div>
      ${ctaBlock()}<p class="foot" style="margin-top:1.4rem">経営フェーズ／${themeObj().name}で創業</p></div></div>`, choices: [] };
}
SCENES.mgmt_win = () => { logOnce("🏢 大型化 ―― ラボを一大企業に育てた", "win");
  return mgmtEndScreen("mgmt_win", figTrophy, "大型化 ―― IPO/大型買収", "経営者としても、成功した", "var(--green)",
    `企業価値は目標を超えた。かつて一人の助教だったあなたは、<b>再現性を武器に、研究室を一つの企業へと育てあげた</b>。物価が上がっても、金利が上がっても ―― <em>Autolab Loop の効率が、あなたの利益を守り続けた</em>。<br><br>霧島教授「速さでも、規模でもない。<b>誰も嘘をつけない仕組みの上で、着実に積み上げた</b>。それが一番、遠くまで来る。見事だ。」`, true); };
SCENES.mgmt_bust = () => { logOnce("💥 資金ショート ―― 経営破綻", "gate");
  return mgmtEndScreen("mgmt_bust", figSealCoin, "経営破綻 ―― 資金ショート", "研究は正しくても、経営は別物だった", "var(--warn)",
    `現金が尽きた。良い研究をしていても、<b>キャッシュが回らなければ会社は止まる</b>。焦った拡大か、金利上昇の直撃か ―― 損益計算書は、その原因を静かに指していた。<br><br>次はきっと、<em>物価と金利を睨みながら、Loop の効率で足腰を固めてから攻める</em>。`, false); };
SCENES.mgmt_stagnant = () => { logOnce("📉 現状維持 ―― 大型化には届かず", "gate");
  return mgmtEndScreen("mgmt_stagnant", figSealClock, "現状維持 ―― 志半ばで任期満了", "潰れはしなかった。だが、跳ねもしなかった", "var(--gold)",
    `会社は生き延びた。だが<b>大型化には届かなかった</b>。守りが過ぎたか、収益源（パイプラインや SaaS）を育て切れなかったか。<br><br>経営は、守りと攻めの配分だ。<em>次はもう少し、伸びる収益源に賭けてみよう。</em>`, false); };

/* ---- 80-endings.js ---- */
function scoreCards(){ return `<div class="scorecard">
  <div class="sc"><div class="k">最終エビデンス</div><div class="v">${state.evidence}</div></div>
  <div class="sc"><div class="k">整合性</div><div class="v">${state.integ}</div></div>
  <div class="sc"><div class="k">信頼</div><div class="v">${state.cred}</div></div>
  <div class="sc"><div class="k">残り研究費</div><div class="v">${Math.max(0,Math.round(state.budget/10000))}<small style="font-size:.6rem">万</small></div></div></div>`; }
function ctaBlock(){ return `<div class="cta"><div class="kick">これは物語ではなく、実在の実行 OS です</div>
  <h3>Autolab Loop ―― wet lab 実測で研究ループを閉じる</h3>
  <p>出典付き手順・捏造ゲート・E-stop・監査 trail。ゲームで触れた機構は、実際に医師と研究者の実験を支えるために作られています。</p>
  <div class="btnrow"><a class="btn btn--solid" href="${PRODUCT_URL}">製品を見る</a><button class="btn btn--ghost" id="shareBtn">結果をシェア</button><button class="btn btn--ghost" id="replayBtn">もう一度プレイ</button></div></div>`; }
function epilogue(){ const notes=[];
  if(state.whistleblew) notes.push(`<p class="story" style="color:var(--teal-dark)"><b>そして ―― </b>あなたが捏造を見抜き正した記録も trail に残った。研究室の誰もが、あなたのデータを信じられるようになった。</p>`);
  if(state.complicit) notes.push(`<p class="story" style="color:var(--warn)"><b>心残り ―― </b>見て見ぬふりをした佐倉の捏造は、まだ trail の奥で眠っている。いつか誰かが気づくだろう。</p>`);
  if(state.auditCleared) notes.push(`<p class="story" style="color:var(--teal-dark)"><b>それに ―― </b>抜き打ちの研究公正監査すら、あなたの改竄不能な記録の前では一瞬で終わった。「模範的だ」と監査官は言い残していった。</p>`);
  else if(state.auditFlagged) notes.push(`<p class="story" style="color:var(--gold)"><b>教訓 ―― </b>あの監査で記録の弱さを突かれた。潔白でも、示せなければ意味がない ―― 平時の記録こそが、いざという時の盾になる。</p>`);
  return notes.join(""); }
function assessScore(){ const abAvg=(state.ab.jikken+state.ab.toukei+state.ab.shidou+state.ab.hasshin)/4;
  return Math.round(state.evidence*0.5 + state.integ*0.5 + state.cred*0.5 + abAvg*0.6 + state.skills.length*4 + (state.whistleblew?10:0) - (state.complicit?12:0) + (state.auditCleared?6:0) - ((state.fabricated&&!state.corrected)?60:0) + (state.diff==="hard"?18:state.diff==="easy"?-12:0)); }
function assessRank(){ const s=assessScore(); return s>=205?"S":s>=170?"A":s>=135?"B":s>=100?"C":"D"; }
function rankSeal(){ const r=assessRank(); const col={ S:"#c45c3e", A:"#2d6a4f", B:"#1a5f7a", C:"#4a5c58", D:"#8a8577" }[r]||"#4a5c58";
  return `<div class="rankseal" style="--rc:${col}"><span class="rankseal-r">${r}</span><span class="rankseal-l">査定</span></div>`; }
function finalTitle(){ if(state.fabricated && !state.corrected) return "研究不正者"; if(state.whistleblew || state.auditCleared) return "研究公正の守り手";
  const ab=state.ab, top=Object.keys(ab).sort((a,b)=>ab[b]-ab[a])[0];
  if((state.students.taku.grow>=70||state.students.misaki.grow>=70) && ab.shidou>=70) return "名伯楽（めいはくらく）";
  if(ab[top]<75) return "堅実な実務家";
  return { jikken:"ベンチの魔術師", toukei:"統計の鬼", shidou:"名伯楽（めいはくらく）", hasshin:"発信力の旗手" }[top]; }
function endTitleHTML(){ return `<div style="margin:0 auto 1rem;max-width:34rem"><div style="font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted)">査定ランク <b style="font-family:var(--serif);font-size:1.15rem;color:var(--teal-dark)">${assessRank()}</b>　／　称号</div><div style="font-family:var(--serif);font-size:1.2rem;color:var(--teal-dark)">「${finalTitle()}」</div></div>`; }
function endCardHTML(){ const abs=[["jikken","実験力"],["toukei","統計力"],["shidou","指導力"],["hasshin","発信力"]];
  const cells=abs.map(([k,l])=>{ const v=state.ab[k],g=grade(v); return `<div class="abcell"><span class="an">${l}</span><span class="amini"><i style="width:${v}%"></i></span><span class="grade g-${g}">${g}</span></div>`; }).join("");
  const sk=state.skills.length?state.skills.map(id=>`<span class="skill">✦ ${SKILLS[id]?SKILLS[id].name:id}</span>`).join(""):'<span class="empty2">―</span>';
  return `<div class="card" style="max-width:34rem;margin:0 auto 1.2rem;text-align:left"><h3>最終能力カード（助教）</h3><div class="abgrid">${cells}</div><div class="skills">${sk}</div></div>`; }
function endingScreen(endId, figFn, verdict, verdictColor, title, story, win){ return { fullscreen:true, endId, confetti:!!win,
  html:`<div class="scene ending"><div class="ending-hero">${figFn()}${rankSeal()}</div><div class="ending-in">
    <div class="verdict" style="color:${verdictColor}">${verdict}</div><h2>${title}</h2><p class="story">${story}</p>${epilogue()}
    ${endTitleHTML()}${endCardHTML()}${scoreCards()}${ctaBlock()}<p class="foot" style="margin-top:1.4rem">難易度：${curDiff().name}／テーマ：${themeObj().name}／偽陽性の型：${ARTIFACT[state.theme]||'―'}／${BACKGROUNDS[state.bg].name}でプレイ</p></div></div>`, choices:[] }; }
function figTrophy(){ return `<div style="position:absolute; inset:0; background:linear-gradient(#0c3d3a,#12463f);"><div class="fig-center"><svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="#a8dadc" stroke-width="1.4" class="rise"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0z" fill="rgba(168,218,220,.15)"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3" stroke-linecap="round"/><circle class="shine" cx="12" cy="7" r="2" fill="#ffd166" stroke="none"/></svg></div></div>`; }
function figSealPaper(){ return `<div style="position:absolute; inset:0; background:linear-gradient(#eef3f5,#e2ecee);">${figPaper()}</div>`; }
function figSealWarn(){ return `<div style="position:absolute; inset:0; background:linear-gradient(#3a1113,#4a1618);"><div class="fig-center"><svg width="110" height="110" viewBox="0 0 24 24" fill="none" stroke="#ffb3b5" stroke-width="1.6" class="shield-body"><path d="M12 3l9 16H3z" stroke-linejoin="round" fill="rgba(155,34,38,.4)"/><path d="M12 9v5M12 17h.01" stroke-linecap="round"/></svg></div></div>`; }
function figSealClock(){ return `<div style="position:absolute; inset:0; background:linear-gradient(#3a2c12,#4a3818);"><div class="fig-center"><svg width="110" height="110" viewBox="0 0 24 24" fill="none" stroke="#ffd8a8" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="6s" repeatCount="indefinite"/></path></svg></div></div>`; }
function figSealCoin(){ return `<div style="position:absolute; inset:0; background:linear-gradient(#3a2c12,#4a3818);"><div class="fig-center"><svg width="110" height="110" viewBox="0 0 24 24" fill="none" stroke="#ffd8a8" stroke-width="1.6" class="rise"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5a2.5 2 0 0 1 5 0c0 2.5-5 1.5-5 4a2.5 2 0 0 0 5 0" stroke-linecap="round"/></svg></div></div>`; }
function figSealFired(){ return `<div style="position:absolute; inset:0; background:linear-gradient(#2a2622,#3a332c);"><div class="fig-center"><svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="#c9c2b4" stroke-width="1.5"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke-linecap="round"/><path d="M16 17l5-5-5-5" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 12H9" stroke-linecap="round"/></svg></div></div>`; }
SCENES.end_best=()=>{ logOnce("🏆 研究成果を発表し、准教授に内定","win"); return endingScreen("end_best",figTrophy,"栄転 ―― 准教授内定","var(--green)","再現性のある発見で、次のステージへ",
  `${themeObj().name} のリードは用量反応でも効き、査読者の「どうやった？」には監査 trail が即答した。出典付きの条件、E-stop に守られた実行、FDR で裏取りした解析 ―― すべてが一本の loop でつながっている。<br><br>

   霧島教授「これは"それっぽい成果"じゃない。<b>再現できる成果</b>と、<b>次を育てる力</b>だ。……いい助教だったよ。次は同僚として、頼む。」`, true); };
SCENES.end_ok=()=>{ logOnce("📄 成果は出たが薄氷の発表","win"); return endingScreen("end_ok",figSealPaper,"研究成果 ―― 辛勝","var(--teal)","成果は出た。だが、薄氷だった",
  `ヒットは形になり論文は出た。しかし確認は甘く、あるいは予算と時間を使い切ってのゴールだった。霧島教授「通ったのは通った。……次はもう少し、対照と用量反応に余裕を持とう。」<br><br>loop は回った。あとはどれだけ堅く閉じられるか ―― それが再現性の差になる。`, false); };
SCENES.end_retract=()=>{ logOnce("⚠ 撤回 ―― 捏造の露見","gate"); return endingScreen("end_retract",figSealWarn,"敗北 ―― 論文撤回","var(--warn)","水増しは、trail に残っていた",
  `追試で報告値が再現されず、監査 trail が生データとの乖離を突きつけた。論文は撤回。霧島教授「……速さのために誠実さを売ったな。loop は止めようとした。止めなかったのは君だ。」<br><br>捏造ゲートは何度もあなたを止めようとした。Autolab Loop が守ろうとしていたのは、まさにこの結末からだった。`, false); };
SCENES.end_timeout=()=>{ logOnce("⏳ 時間切れ ―― loop を閉じ切れず","gate"); return endingScreen("end_timeout",figSealClock,"敗北 ―― 時間切れ","var(--gold)","ベンチで時間が尽きた",
  `再現性のある成果に届く前に、任期が終わった。エビデンスは ${state.evidence} 止まり。霧島教授「筋は悪くなかった。ただ、一周ごとの手数が多すぎた。」<br><br>ヒントは"どこで根拠づけに時間をかけ、どこで機械に任せるか"。loop の速さは、正しい省き方から生まれる。`, false); };
SCENES.end_broke=()=>{ logOnce("💴 予算切れ ―― loop 停止","gate"); return endingScreen("end_broke",figSealCoin,"敗北 ―― 予算切れ","var(--gold)","研究費が底をついた",

SCENES.end_fired=()=>{ logOnce("🚪 解雇 ―― Autolab Loop を活かせず","gate"); return endingScreen("end_fired",figSealFired,"敗北 ―― 解雇通告","var(--warn)","「君には、任せられない」",
  `霧島教授は静かに言った。「高いシステムを入れたのは、"それっぽい研究"を量産するためじゃない。<br>君は loop を使わなかった ―― 出典を飛ばし、ゲートを避け、E-stop を軽んじ、QC を握りつぶした。結果は<b>再現せず、予算と時間だけが溶けた</b>。警告もした。」<br><br>
   ${state.warnings?`（警告 ${state.warnings} 回）　`:""}あなたは研究室を去ることになった。荷物をまとめる背に、ループの通知音だけが淡々と鳴っていた。<br><br>
   <b>Autolab Loop は道具ではなく、規律だ。</b>正しく使う者だけが、効率と再現性を ―― そして自分の職を ―― 守れる。`, false); };
function logOnce(text,kind){ if(!state._ended){ log(text,kind); state._ended=true; } }


/* ============================================================
   起動・配線
   ============================================================ */

/* ---- 90-main.js ---- */
function bootTitle(){ Object.assign(state, freshState()); prevHud=null; render("title"); }
// Create/resume the AudioContext ONLY after a real gesture (capture+once → runs
// before any bubble handler), so the title BGM starts cleanly with no autoplay warnings.
function unlockAudio(){ if(AUDIO.unlocked) return; AUDIO.unlocked=true; audioInit(); audioResume();
  if(AUDIO.bgmDesired && !AUDIO.muted) bgmStart(AUDIO.bgmDesired); }
document.addEventListener("pointerdown", unlockAudio, { capture:true, once:true });
document.addEventListener("keydown", unlockAudio, { capture:true, once:true });
document.addEventListener("click",(e)=>{ unlockAudio(); const id=e.target && e.target.id;
  if(id==="muteTop"){ e.preventDefault(); setMuted(!AUDIO.muted); if(!AUDIO.muted) sfx("select"); return; }
  if(id==="dataTop"){ e.preventDefault(); showConsentBar(); return; }
  if(id==="consentYes"){ e.preventDefault(); setTelemetryConsent(true); return; }
  if(id==="consentNo"){ e.preventDefault(); setTelemetryConsent(false); return; }
  if(id==="startBtn"){ e.preventDefault(); clearSave(); telNewSession(); Object.assign(state,freshState()); prevHud=null; render("difficulty_pick"); }
  else if(id==="continueBtn"){ e.preventDefault(); telNewSession(); if(!loadGame()){ toast("セーブの読み込みに失敗しました"); bootTitle(); } }
  else if(id==="replayBtn"){ e.preventDefault(); clearSave(); telNewSession(); bootTitle(); }
  else if(id==="restartTop"){ e.preventDefault(); if(!confirm("最初からやり直しますか？（保存データは消えます）")) return; clearSave(); bootTitle(); }
  else if(id==="suspendTop"){ e.preventDefault(); if(!state.theme){ return; } toast("進行を保存しました。タイトルへ戻ります"); render("title"); }
  else if(id==="shareBtn"){ e.preventDefault(); shareResult(); }
});
function shareResult(){ const t=themeObj();
  const line=`オートラボ・クエストで「${t.name}」を研究 → エビデンス${state.evidence}・整合性${state.integ}でクリア。同僚の捏造疑惑や競合レースをくぐり抜けるバイオ研究ゲーム、Autolab Loop 製。`;
  const url=location.href;
  if(navigator.share){ navigator.share({ title:"オートラボ・クエスト", text:line, url }).catch(()=>{}); }
  else if(navigator.clipboard){ navigator.clipboard.writeText(line+" "+url).then(()=>toast("結果をコピーしました！SNS に貼り付けてください"),()=>toast(line)); }
  else toast(line); }
document.addEventListener("keydown",(e)=>{
  const n=parseInt(e.key,10);
  if(!isNaN(n)&&n>=1&&n<=9){ const btns=stage.querySelectorAll(".choice"); if(btns[n-1]){ e.preventDefault(); btns[n-1].click(); } return; }
  // Enter / Space advances a single-choice beat, or the primary button on the
  // title / ending (fullscreen) — but never auto-picks when there's a real choice.
  if(e.key==="Enter"||e.key===" "){ const choices=stage.querySelectorAll(".choice");
    if(choices.length===1){ e.preventDefault(); choices[0].click(); return; }
    if(choices.length===0){ const primary=stage.querySelector(".btn--solid,.btn--big"); if(primary){ e.preventDefault(); primary.click(); } } }
});

// Seed gameplay RNG: real time in the browser (varied runs), fixed fallback
// where Date is unavailable (e.g. the test sandbox) so tests are deterministic.
try { seedRng((typeof Date !== "undefined" && Date.now) ? (Date.now() & 0x7fffffff) : 0x12345678); }
catch (e) { seedRng(0x12345678); }

initAmbient();
updateMuteBtn();
// Always initialize state before the first render — the title's paint*() read
// state fields, and a saved game only affects the "つづきから" button (which
// reads localStorage), not the title's own state.
bootTitle();
updateDataBtn();       // reflect current data-donation state on the 📊 top link
maybeConsent();        // first run (consent unset): show the opt-in banner
telFlushAll();         // resend any events buffered while an endpoint was offline

</script>
