<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>オートラボ・クエスト ― DMTA ループで新薬を見つけろ | Autolab Loop</title>
<meta name="description" content="バイオ研究者になりきって大学研究室で実験を回し、再現性のある研究成果を出す選択式アドベンチャー。捏造疑惑・研究室の揉め事・ライバル競争・DMTAループを、Autolab Loop の実行OSごと遊べます。セーブ対応。" />
<meta property="og:title" content="オートラボ・クエスト ― DMTA ループで新薬を見つけろ" />
<meta property="og:description" content="大学研究室で実験を設計・実行し、同僚の捏造疑惑やライバルとの競争をくぐり抜けて再現性のある成果を出せ。Autolab Loop をゲームで体験。" />
<meta property="og:type" content="website" />
<style>
:root{
    --ink:#0f1f1c; --ink-muted:#4a5c58; --paper:#f5f0e8; --paper-alt:#ebe4d8;
    --teal:#1a5f7a; --teal-dark:#0c3d3a; --green:#2d6a4f; --hit:#c45c3e;
    --rule:#d4cfc4; --warn:#9b2226; --gold:#bc6c25; --violet:#5f3dc4; --sky:#a8dadc;
    --accent:#1a5f7a;   /* per-theme accent — set on <html> at render time */
    --serif: Georgia,'Times New Roman','Yu Mincho','Hiragino Mincho ProN',serif;
    --sans: system-ui,-apple-system,'Segoe UI','Hiragino Sans','Noto Sans JP',sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ font-family:var(--sans); color:var(--ink); line-height:1.65; min-height:100vh; overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(ellipse 70% 45% at 78% 0%, rgba(26,95,122,.10), transparent 70%),
      linear-gradient(rgba(26,95,122,.035) 1px, transparent 1px) 0 0/48px 48px,
      linear-gradient(90deg, rgba(26,95,122,.035) 1px, transparent 1px) 0 0/48px 48px,
      var(--paper); }
  .wrap{ max-width:1080px; margin:0 auto; padding:0 1.1rem 3rem; position:relative; z-index:1; }
  #ambient{ position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.5; }

  .top{ display:flex; align-items:center; gap:.6rem; padding:1.1rem .2rem .9rem; flex-wrap:wrap; }
  .brand-mark{ width:30px; height:30px; flex:none; animation:spin 14s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  .brand-txt strong{ font-family:var(--serif); font-size:1.02rem; display:block; line-height:1.1; }
  .brand-txt span{ font-size:.66rem; letter-spacing:.08em; color:var(--ink-muted); text-transform:uppercase; }
  .top .spacer{ flex:1; }
  .savechip{ font-size:.66rem; color:var(--green); border:1px solid rgba(45,106,79,.3); background:rgba(45,106,79,.08);
    padding:.28rem .6rem; border-radius:999px; display:inline-flex; align-items:center; gap:.3rem; }
  .savechip .dot{ width:6px; height:6px; border-radius:50%; background:var(--green); }
  .savechip.on .dot{ animation:blink 1.4s steps(1) infinite; }
  .toplink{ font-size:.76rem; color:var(--teal-dark); text-decoration:none; border:1px solid var(--rule);
    padding:.3rem .65rem; border-radius:999px; background:#fff; cursor:pointer; transition:transform .15s, background .15s; }
  .toplink:hover{ background:rgba(26,95,122,.07); transform:translateY(-1px); }

  .hud{ display:grid; grid-template-columns:repeat(4,1fr); gap:.6rem; margin-bottom:.6rem; }
  @media (max-width:640px){ .hud{ grid-template-columns:repeat(2,1fr);} }
  .stat{ background:#fff; border:1px solid var(--rule); border-radius:9px; padding:.6rem .75rem; position:relative; }
  .stat .k{ font-size:.62rem; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-muted); }
  .stat .v{ font-family:var(--serif); font-size:1.28rem; line-height:1.15; margin-top:.1rem; }
  .stat .v small{ font-size:.7rem; color:var(--ink-muted); font-family:var(--sans); }
  .bar{ height:4px; border-radius:3px; background:var(--paper-alt); margin-top:.4rem; overflow:hidden; }
  .bar i{ display:block; height:100%; border-radius:3px; transition:width .5s cubic-bezier(.4,0,.2,1); }
  .stat--budget .bar i{ background:var(--gold); } .stat--weeks .bar i{ background:var(--teal); }
  .stat--cred .bar i{ background:var(--green); } .stat--integ .bar i{ background:var(--teal-dark); }
  .stat.low .v{ color:var(--warn); }
  .stat.bump{ animation:bump .45s ease; }
  @keyframes bump{ 0%{ transform:scale(1);} 40%{ transform:scale(1.05); box-shadow:0 0 0 3px rgba(26,95,122,.12);} 100%{ transform:scale(1);} }
  .delta{ position:absolute; right:.6rem; top:.3rem; font-size:.78rem; font-weight:800; pointer-events:none; animation:floatUp 1.15s ease forwards; }
  .delta.pos{ color:var(--green); } .delta.neg{ color:var(--warn); }
  @keyframes floatUp{ 0%{ opacity:0; transform:translateY(6px);} 20%{ opacity:1;} 100%{ opacity:0; transform:translateY(-16px);} }

  .evrow{ display:flex; align-items:center; gap:.7rem; background:var(--teal-dark); color:#fff; border-radius:9px 9px 0 0; padding:.55rem .9rem; }
  .evrow.solo{ border-radius:9px; margin-bottom:1rem; }
  .evrow .lab{ font-size:.66rem; letter-spacing:.06em; text-transform:uppercase; color:var(--sky); flex:none; }
  .evbar{ flex:1; height:9px; background:rgba(255,255,255,.14); border-radius:6px; overflow:hidden; position:relative; }
  .evbar i{ display:block; height:100%; background:linear-gradient(90deg,var(--sky),var(--accent)); border-radius:6px; transition:width .6s cubic-bezier(.4,0,.2,1); position:relative; }
  .evbar i::after{ content:''; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent); animation:shimmer 2.4s linear infinite; }
  @keyframes shimmer{ 0%{ transform:translateX(-100%);} 100%{ transform:translateX(220%);} }
  .evrow .rnd{ font-size:.72rem; color:rgba(255,255,255,.8); flex:none; }
  .rivalrow{ display:flex; align-items:center; gap:.7rem; background:#20302d; color:#fff; border-radius:0 0 9px 9px; padding:.45rem .9rem; margin-bottom:1rem; border-top:1px solid rgba(255,255,255,.08); }
  .rivalrow .lab{ font-size:.66rem; letter-spacing:.04em; color:#e6a; color:#f0a58c; flex:none; }
  .rivalbar{ flex:1; height:6px; background:rgba(255,255,255,.12); border-radius:6px; overflow:hidden; }
  .rivalbar i{ display:block; height:100%; background:linear-gradient(90deg,#bc6c25,#c45c3e); border-radius:6px; transition:width .6s ease; }
  .rivalrow .pct{ font-size:.68rem; color:rgba(255,255,255,.75); flex:none; }

  .grid{ display:grid; grid-template-columns:1fr 300px; gap:1rem; align-items:start; }
  @media (max-width:860px){ .grid{ grid-template-columns:1fr; } }
  .scene{ background:#fff; border:1px solid var(--rule); border-radius:12px; box-shadow:0 18px 40px rgba(12,61,58,.07);
    animation:sceneIn .45s cubic-bezier(.2,.7,.3,1); overflow:hidden; }
  @keyframes sceneIn{ from{opacity:0; transform:translateY(12px) scale(.99);} to{opacity:1; transform:none;} }
  .scene-body{ padding:1.5rem 1.7rem 1.7rem; }
  .figure{ position:relative; height:170px; overflow:hidden; border-bottom:3px solid var(--accent); transition:border-color .5s ease;
    background:radial-gradient(ellipse 120% 90% at 50% 120%, rgba(26,95,122,.10), transparent), linear-gradient(#f7f3ec,#eee7db); }
  .figure svg{ display:block; }
  .fig-center{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .badge{ display:inline-block; font-size:.64rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; padding:.28rem .6rem; border-radius:999px; margin-bottom:.9rem; }
  .badge.design{ background:rgba(26,95,122,.12); color:var(--teal-dark); }
  .badge.make{ background:rgba(188,108,37,.14); color:var(--gold); }
  .badge.test{ background:rgba(95,61,196,.12); color:var(--violet); }
  .badge.analyze{ background:rgba(45,106,79,.14); color:var(--green); }
  .badge.story{ background:var(--paper-alt); color:var(--ink-muted); }
  .badge.event{ background:rgba(196,92,62,.14); color:var(--hit); }
  .scene h2{ font-family:var(--serif); font-size:1.42rem; line-height:1.25; margin:.1rem 0 .8rem; }
  .scene .body{ font-size:.96rem; }
  .scene .body p{ margin:.55rem 0; }
  .scene .body em{ color:var(--teal-dark); font-style:normal; font-weight:600; }
  .scene .body .fig{ background:var(--paper); border:1px solid var(--rule); border-radius:8px; padding:.7rem .85rem; font-size:.85rem; color:var(--ink-muted); margin:.8rem 0; }
  .scene .body .fig b{ color:var(--ink); }

  .loop{ display:flex; gap:.65rem; align-items:flex-start; margin:1rem 0 1.15rem; background:rgba(26,95,122,.06);
    border-left:3px solid var(--teal); border-radius:0 8px 8px 0; padding:.7rem .85rem; }
  .loop .ava{ width:28px; height:28px; flex:none; border-radius:50%; background:var(--teal-dark); display:flex; align-items:center; justify-content:center; animation:pulseAva 2.4s ease-in-out infinite; }
  @keyframes pulseAva{ 0%,100%{ box-shadow:0 0 0 0 rgba(26,95,122,.4);} 50%{ box-shadow:0 0 0 6px rgba(26,95,122,0);} }
  .loop .ava svg{ width:16px; height:16px; }
  .loop .msg{ font-size:.85rem; color:var(--teal-dark); }
  .loop .msg b{ display:block; font-size:.62rem; letter-spacing:.08em; text-transform:uppercase; color:var(--teal); margin-bottom:.1rem; }
  .loop .cursor{ display:inline-block; width:.5em; margin-left:1px; animation:blink 1s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:0; } }
  .loop.gate{ background:rgba(155,34,38,.07); border-color:var(--warn); }
  .loop.gate .ava{ background:var(--warn); } .loop.gate .msg,.loop.gate .msg b{ color:var(--warn); }

  .choices{ display:flex; flex-direction:column; gap:.6rem; margin-top:.4rem; }
  .choice{ text-align:left; width:100%; background:#fff; border:1px solid var(--rule); border-radius:9px; padding:.8rem .95rem; cursor:pointer;
    transition:border-color .15s, box-shadow .15s, background .15s, transform .1s; font:inherit; position:relative; animation:choiceIn .4s backwards; }
  .choice:nth-child(1){ animation-delay:.05s;} .choice:nth-child(2){ animation-delay:.11s;} .choice:nth-child(3){ animation-delay:.17s;} .choice:nth-child(4){ animation-delay:.23s;}
  @keyframes choiceIn{ from{opacity:0; transform:translateX(-8px);} to{opacity:1; transform:none;} }
  .choice:hover{ border-color:var(--teal); box-shadow:0 4px 14px rgba(26,95,122,.14); background:rgba(26,95,122,.02); transform:translateX(3px); }
  .choice:focus-visible{ outline:none; border-color:var(--teal); box-shadow:0 0 0 3px rgba(26,95,122,.28); background:rgba(26,95,122,.03); }
  .btn:focus-visible{ outline:none; box-shadow:0 0 0 3px rgba(26,95,122,.35); }
  .choice .ct{ font-size:.94rem; font-weight:600; display:flex; gap:.5rem; align-items:baseline; }
  .choice .num{ font-family:var(--serif); color:var(--teal); font-size:.9rem; flex:none; }
  .choice .cd{ font-size:.81rem; color:var(--ink-muted); margin-top:.15rem; }
  .choice .cost{ margin-top:.4rem; display:flex; flex-wrap:wrap; gap:.3rem; }
  .tag{ font-size:.67rem; padding:.16rem .45rem; border-radius:5px; background:var(--paper-alt); color:var(--ink-muted); }
  .tag.pos{ background:rgba(45,106,79,.14); color:var(--green); } .tag.neg{ background:rgba(155,34,38,.10); color:var(--warn); }
  .tag.cost{ background:rgba(188,108,37,.14); color:var(--gold); } .tag.risk{ background:rgba(95,61,196,.12); color:var(--violet); }
  .tag.rel{ background:rgba(26,95,122,.12); color:var(--teal-dark); }

  .side{ position:sticky; top:.6rem; }
  .trail{ background:var(--teal-dark); color:#fff; border-radius:12px; padding:1rem 1rem .4rem; }
  .trail h3{ font-size:.66rem; letter-spacing:.1em; text-transform:uppercase; color:var(--sky); margin:.1rem 0 .7rem; display:flex; align-items:center; gap:.4rem; }
  .trail .list{ max-height:420px; overflow:auto; display:flex; flex-direction:column; gap:.5rem; padding-bottom:.7rem; }
  @media (max-width:860px){ .trail .list{ max-height:190px; } }
  .li{ font-size:.75rem; line-height:1.4; color:rgba(255,255,255,.85); border-left:2px solid rgba(255,255,255,.18); padding-left:.55rem; animation:liIn .4s ease backwards; }
  @keyframes liIn{ from{opacity:0; transform:translateX(6px);} to{opacity:1; transform:none;} }
  .li .meta{ display:block; font-size:.59rem; color:rgba(255,255,255,.45); letter-spacing:.04em; }
  .li.gate{ border-color:var(--hit); } .li.estop{ border-color:#ffd166; } .li.money{ border-color:var(--gold); }
  .li.integ{ border-color:var(--sky); } .li.win{ border-color:var(--green); } .li.drama{ border-color:var(--violet); }
  .trail .empty{ font-size:.75rem; color:rgba(255,255,255,.45); padding-bottom:.8rem; }
  .roster{ background:#fff; border:1px solid var(--rule); border-radius:12px; padding:.85rem 1rem; margin-top:.8rem; }
  .roster h3{ font-size:.64rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-muted); margin:.1rem 0 .6rem; }
  .rmember{ display:flex; align-items:center; gap:.55rem; margin-bottom:.55rem; } .rmember:last-child{ margin-bottom:0; }
  .rava{ width:30px; height:30px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:.8rem; font-family:var(--serif); }
  .rinfo{ flex:1; min-width:0; } .rname{ font-size:.8rem; font-weight:600; line-height:1.1; } .rrole{ font-size:.63rem; color:var(--ink-muted); }
  .rbar{ height:4px; background:var(--paper-alt); border-radius:3px; margin-top:.25rem; overflow:hidden; } .rbar i{ display:block; height:100%; border-radius:3px; transition:width .5s ease; }

  .hero{ text-align:center; padding:1.2rem 1.4rem 2rem; }
  .hero .kick{ font-size:.7rem; letter-spacing:.16em; text-transform:uppercase; color:var(--teal); font-weight:700; }
  .hero h1{ font-family:var(--serif); font-size:clamp(1.9rem,5vw,2.9rem); line-height:1.18; margin:.6rem 0 .5rem; }
  .hero h1 em{ font-style:italic; color:var(--teal-dark); }
  .hero .sub{ color:var(--ink-muted); max-width:40rem; margin:0 auto 1.4rem; font-size:1.02rem; }
  .hero .pills{ display:flex; flex-wrap:wrap; gap:.4rem; justify-content:center; margin:0 auto 1.6rem; max-width:40rem; }
  .hero .pills span{ font-size:.72rem; font-weight:600; padding:.34rem .72rem; border-radius:999px; background:rgba(26,95,122,.08); color:var(--teal-dark); border:1px solid rgba(26,95,122,.16); animation:pillIn .5s backwards; }
  @keyframes pillIn{ from{opacity:0; transform:translateY(8px) scale(.9);} to{opacity:1; transform:none;} }
  .btn{ display:inline-flex; align-items:center; gap:.4rem; justify-content:center; cursor:pointer; font:inherit; font-weight:700; font-size:.95rem; padding:.75rem 1.7rem; border-radius:6px; border:none; text-decoration:none; transition:transform .12s, background .15s, box-shadow .15s; }
  .btn:hover{ transform:translateY(-2px); }
  .btn--solid{ background:var(--teal-dark); color:#fff; box-shadow:0 6px 18px rgba(12,61,58,.22); } .btn--solid:hover{ background:#0a302e; }
  .btn--ghost{ background:transparent; border:1px solid var(--teal-dark); color:var(--teal-dark); } .btn--ghost:hover{ background:rgba(12,61,58,.06); }
  .btn--big{ font-size:1.05rem; padding:.9rem 2rem; }
  .btnrow{ display:flex; flex-wrap:wrap; gap:.6rem; justify-content:center; margin-top:.4rem; }
  .hero-stage{ height:230px; position:relative; margin:.4rem auto 1.4rem; max-width:520px; }
  .howto{ max-width:44rem; margin:1.4rem auto 0; text-align:left; background:#fff; border:1px solid var(--rule); border-radius:12px; padding:1.3rem 1.5rem; }
  .howto h3{ font-family:var(--serif); font-size:1.05rem; margin:.1rem 0 .7rem; }
  .howto ul{ margin:0; padding-left:1.1rem; font-size:.9rem; color:var(--ink-muted); } .howto li{ margin:.35rem 0; } .howto li b{ color:var(--ink); }
  .continue-note{ font-size:.8rem; color:var(--ink-muted); margin-top:.9rem; }
  /* 学びの記録（コーデックス） */
  .codex{ max-width:44rem; margin:1rem auto 0; text-align:left; background:linear-gradient(#fbf9f4,#f3eee4); border:1px solid var(--rule); border-radius:12px; padding:1.1rem 1.5rem; }
  .codex h3{ font-family:var(--serif); font-size:1rem; margin:.1rem 0 .7rem; } .codex h3 b{ color:var(--hit); }
  .codex-list{ list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill,minmax(15rem,1fr)); gap:.35rem .9rem; }
  .codex-item{ display:flex; align-items:center; gap:.5rem; font-size:.82rem; }
  .codex-dot{ width:9px; height:9px; border-radius:50%; flex:none; background:var(--rule); box-shadow:0 0 0 2px rgba(0,0,0,.03); }
  .codex-item.got b{ color:var(--ink); font-weight:600; } .codex-item.got .codex-art{ color:var(--ink-muted); margin-left:auto; padding-left:.5rem; }
  .codex-item.locked{ opacity:.6; } .codex-q{ color:var(--ink-muted); font-style:italic; }
  .codex-note{ font-size:.78rem; color:var(--ink-muted); margin:.7rem 0 0; }
  .codex--done{ border-color:var(--gold); background:linear-gradient(#fbf6ea,#f3ecda); box-shadow:0 4px 18px rgba(188,108,37,.14); }
  .codex--done h3{ color:var(--gold); } .codex--done h3 b{ color:var(--gold); }
  /* 経営フェーズ（tycoon） */
  .mgmt-dash{ background:var(--teal-dark); color:#eaf3f2; border-radius:10px; padding:.7rem .9rem; margin-bottom:.8rem; }
  .mgmt-kpis{ display:flex; flex-wrap:wrap; gap:.3rem .9rem; font-size:.8rem; }
  .mgmt-kpis b{ color:#fff; }
  .mgmt-goal{ display:flex; align-items:center; gap:.7rem; margin-top:.5rem; font-size:.78rem; border-top:1px solid rgba(255,255,255,.15); padding-top:.5rem; }
  .mgmt-goalbar{ flex:1; height:8px; background:rgba(255,255,255,.15); border-radius:5px; overflow:hidden; }
  .mgmt-goalbar i{ display:block; height:100%; background:linear-gradient(90deg,var(--sky),var(--green)); border-radius:5px; transition:width .6s; }
  .mgmt-stmts{ display:grid; grid-template-columns:1fr 1fr; gap:.9rem; margin-top:.6rem; }
  @media (max-width:640px){ .mgmt-stmts{ grid-template-columns:1fr; } }
  .stmt{ background:#fff; border:1px solid var(--rule); border-radius:10px; padding:.7rem .9rem; }
  .stmt h4{ margin:.1rem 0 .5rem; font-family:var(--serif); font-size:.92rem; color:var(--teal-dark); }
  .pl-row{ display:flex; justify-content:space-between; font-size:.8rem; padding:.12rem 0; color:var(--ink-muted); gap:.5rem; }
  .pl-row span:last-child{ font-variant-numeric:tabular-nums; white-space:nowrap; }
  .pl-row.head{ font-weight:700; color:var(--ink); border-top:1px solid var(--rule); margin-top:.2rem; padding-top:.3rem; }
  .pl-sub{ padding-left:.3rem; }
  .pl-row.net{ font-weight:700; border-top:2px solid var(--rule); margin-top:.3rem; padding-top:.35rem; font-size:.9rem; color:var(--ink); }
  .pl-row.net.pos span:last-child{ color:var(--green); } .pl-row.net.neg span:last-child{ color:var(--warn); }

  .ending{ background:#fff; border:1px solid var(--rule); border-radius:14px; overflow:hidden; box-shadow:0 20px 46px rgba(12,61,58,.10); animation:sceneIn .5s ease; }
  .ending-hero{ height:200px; position:relative; overflow:hidden; }
  .ending-in{ padding:1.6rem 1.9rem 2rem; text-align:center; }
  .ending .verdict{ font-size:.76rem; letter-spacing:.14em; text-transform:uppercase; font-weight:700; margin-bottom:.5rem; }
  .ending h2{ font-family:var(--serif); font-size:1.7rem; margin:.1rem 0 .5rem; }
  .ending .story{ color:var(--ink-muted); max-width:38rem; margin:0 auto 1.2rem; font-size:.96rem; }
  .scorecard{ display:grid; grid-template-columns:repeat(4,1fr); gap:.5rem; max-width:34rem; margin:0 auto 1.3rem; }
  @media (max-width:560px){ .scorecard{ grid-template-columns:repeat(2,1fr);} }
  .scorecard .sc{ background:var(--paper); border:1px solid var(--rule); border-radius:8px; padding:.55rem; }
  .scorecard .sc .k{ font-size:.6rem; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-muted); }
  .scorecard .sc .v{ font-family:var(--serif); font-size:1.15rem; }
  .cta{ background:var(--teal-dark); color:#fff; border-radius:12px; padding:1.4rem; max-width:40rem; margin:0 auto; }
  .cta .kick{ font-size:.66rem; letter-spacing:.12em; text-transform:uppercase; color:var(--sky); }
  .cta h3{ font-family:var(--serif); font-size:1.15rem; margin:.4rem 0 .3rem; color:#fff; }
  .cta p{ font-size:.88rem; color:rgba(255,255,255,.8); margin:0 0 1rem; }
  .cta .btn--solid{ background:#fff; color:var(--teal-dark); } .cta .btn--ghost{ border-color:rgba(255,255,255,.5); color:#fff; }
  .foot{ text-align:center; font-size:.72rem; color:var(--ink-muted); margin-top:2rem; line-height:1.6; } .foot a{ color:var(--teal-dark); }
  .hidden{ display:none !important; }

function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }

/* Seedable RNG (mulberry32). All *gameplay* randomness goes through rng() so
   runs are reproducible and testable; seedRng() sets the stream. Visual-only
   randomness (confetti) may still use Math.random. */
let _rngState = 0x9e3779b9 >>> 0;
function seedRng(n){ _rngState = ((n >>> 0) || 0x9e3779b9) >>> 0; }
function rng(){ _rngState = (_rngState + 0x6D2B79F5) >>> 0; let t = _rngState; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }
function money(d,why){ state.budget += d; if(why) log(`研究費 ${d>=0?'+':''}${Math.round(d/10000)}万（${why}）`, "money"); }
function weeks(d){ state.weeks += d; }
function cred(d){ state.cred = clamp(state.cred + d, 0, 100); }
function integ(d){ const floor = hasSkill("fujou_allergy") ? 20 : 0; state.integ = clamp(state.integ + d, (d<0 && state.integ>floor)?floor:0, 100); }
function evidence(d){ state.evidence = clamp(state.evidence + d, 0, 300); }
function rel(who,d){ if(state.rel[who]!=null) state.rel[who] = clamp(state.rel[who]+d,0,100); }
function bond(id,d){ if(state.students[id]) state.students[id].bond = clamp(state.students[id].bond+d,0,100); }
function log(text, kind){ state.log.push({ text, kind:kind||"", round:state.round, wk:(state.weeks0||START.weeks)-state.weeks }); }

/* ---------- サクセス風：能力値・やる気・体力・コツ ---------- */
function motiv(d){ state.yaruki = clamp(state.yaruki+d, 0, 100); }
function stam(d){ state.tairyoku = clamp(state.tairyoku+d, 0, 100); }
function motFactor(){ return 0.9 + (state.yaruki/100)*0.25; }                 // 0.90〜1.15
function staFactor(){ return state.tairyoku < 25 ? 0.75 : 1; }               // 疲労で効率ダウン
function hasSkill(id){ return !!(state.skills && state.skills.indexOf(id)>=0); }
function addSkill(id){ if(!state.skills) state.skills=[]; if(hasSkill(id)) return false; state.skills.push(id); log(`特殊能力を習得：${SKILLS[id]?SKILLS[id].name:id}`,"win"); if(typeof toast==="function") toast(`✦ 特殊能力を習得：${SKILLS[id]?SKILLS[id].name:id}`); return true; }
const AB_LABEL = { jikken:"実験力", toukei:"統計力", shidou:"指導力", hasshin:"発信力" };
function abilityGain(k,g){ const b=state.ab[k]; const eff=Math.max(1, Math.round(g*motFactor()*staFactor()*(1-state.ab[k]/140)));
  state.ab[k]=clamp(state.ab[k]+eff,0,100);
  const gb=grade(b), ga=grade(state.ab[k]);   // grade improved? (S best → earlier in the string)
  if(ga!==gb && "SABCDEFG".indexOf(ga) < "SABCDEFG".indexOf(gb)){ const label=AB_LABEL[k]||k;
    log(`能力ランクアップ：${label} ${gb}→${ga}`,"win");
    if(typeof toast==="function") toast(`▲ ${label} ランクアップ！ ${gb} → ${ga}`);
    if(typeof sfx==="function") sfx("rankup"); }
  checkAbilitySkills(k,b,state.ab[k]); return eff; }
function checkAbilitySkills(k,b,a){ if(b<80&&a>=80){ if(k==="jikken") addSkill("seimitsu"); if(k==="toukei") addSkill("toukei_me"); if(k==="shidou") addSkill("mendoumi"); if(k==="hasshin") addSkill("kousho"); } }
function spendStamina(base){ stam(-(hasSkill("taryoku_baka")?Math.round(base*0.6):base)); }
function grade(v){ return v>=90?"S":v>=80?"A":v>=70?"B":v>=60?"C":v>=50?"D":v>=40?"E":v>=30?"F":"G"; }

function applyFxObj(fx){ if(!fx) return; if(fx.budget) money(fx.budget); if(fx.cred) cred(fx.cred); if(fx.integ) integ(fx.integ);
  if(fx.ab) for(const k in fx.ab){ if(state.ab[k]!=null) state.ab[k]=clamp(state.ab[k]+fx.ab[k],0,100); }
  if(fx.skill) addSkill(fx.skill); }

const TELEMETRY = {
  ver: 1,
  endpoint: null,                    // null → local buffer only (export via 📊 / autolabExport())
  consentKey: "autolab_consent_v1",  // "granted" | "denied" | null(unset)

// Endpoint resolution (default stays null = local-only). Precedence: an explicit
// window global wins; otherwise a <meta name="autolab-telemetry-endpoint"> lets the
// host inject a same-origin ingest URL (e.g. /api/telemetry) without editing JS.
try { if (typeof window !== "undefined" && window.AUTOLAB_TELEMETRY_ENDPOINT) TELEMETRY.endpoint = String(window.AUTOLAB_TELEMETRY_ENDPOINT); } catch (e) {}
try { if (TELEMETRY.endpoint == null && typeof document !== "undefined" && document.querySelector) {
  const m = document.querySelector('meta[name="autolab-telemetry-endpoint"]');
  const c = m && m.getAttribute && m.getAttribute("content");
  if (c) TELEMETRY.endpoint = String(c);
} } catch (e) {}

function telNow(){
  try{ if(typeof performance!=="undefined" && performance.now) return Math.round(performance.now()); }catch(e){}
  try{ if(typeof Date!=="undefined" && Date.now) return Date.now(); }catch(e){}
  return 0;
}
function telUuid(){
  try{ if(typeof crypto!=="undefined" && crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
  let s=""; try{ s = telNow().toString(36); }catch(e){ s="0"; }
  for(let i=0;i<10;i++) s += Math.floor(Math.random()*36).toString(36);
  return "sid_"+s;
}
function telText(s){ return String(s==null?"":s).replace(/<[^>]*>/g,"").replace(/\s+/g," ").trim(); }

/* ---- consent ---- */
function telemetryConsent(){ try{ return LS ? LS.getItem(TELEMETRY.consentKey) : null; }catch(e){ return null; } }
function telemetryOn(){ return !!LS && telemetryConsent()==="granted"; }
function setTelemetryConsent(grant){

  hideConsentBar(); updateDataBtn();

  else if(typeof toast==="function") toast("データ提供はオフです。記録しません。");
}

/* ---- session ---- */
function telSession(){ return TELEMETRY._sid || (TELEMETRY._sid = telUuid()); }
function telNewSession(){ TELEMETRY._sid = telUuid(); TELEMETRY._seq = 0; TELEMETRY._started = false; TELEMETRY._endDone = false; }
function telSessionStart(){
  if(TELEMETRY._started || !telemetryOn()) return; TELEMETRY._started = true;
  let ua=""; try{ ua = (typeof navigator!=="undefined" && navigator.userAgent) ? String(navigator.userAgent).slice(0,120) : ""; }catch(e){}
  telPush({ v:TELEMETRY.ver, sid:telSession(), seq:TELEMETRY._seq++, ts:telNow(), type:"session_start",
    diff:state.diff, theme:state.theme, bg:state.bg, ua });
}

/* ---- buffer + best-effort send ---- */
function telRead(){ try{ const raw = LS && LS.getItem(TELEMETRY.bufKey); return raw ? JSON.parse(raw) : []; }catch(e){ return []; } }
function telWrite(arr){ try{ if(LS) LS.setItem(TELEMETRY.bufKey, JSON.stringify(arr)); }catch(e){} }
/* Pseudonymous participant id set by the enroll page (enroll.html) after consent.
   Only this opaque pid rides on events — the pid→identity map lives server-side in
   a separate consent ledger, so the event stream carries no PII. */
function telPid(){ try{ return (LS && LS.getItem("autolab_pid")) || null; }catch(e){ return null; } }
function telPush(ev){
  if(!telemetryOn()) return;
  if(ev.pid == null){ const p = telPid(); if(p) ev.pid = p; }
  const arr = telRead(); arr.push(ev);
  if(arr.length > TELEMETRY.max) arr.splice(0, arr.length - TELEMETRY.max);
  telWrite(arr); telSend(ev);
}
function telPost(ep, body){
  try{
    if(typeof navigator!=="undefined" && navigator.sendBeacon){ navigator.sendBeacon(ep, body); return true; }

function telSend(ev){ const ep = TELEMETRY.endpoint; if(!ep) return; try{ telPost(ep, JSON.stringify(ev)); }catch(e){} }
/* Best-effort resend of the whole local buffer — catches events captured while an

function telFlushAll(){ if(!telemetryOn() || !TELEMETRY.endpoint) return 0; const arr = telRead(); if(!arr.length) return 0;

/* ---- capture ---- */
function telSnapshot(){
  const a = state.ab || {};
  return { budget:Math.round((state.budget||0)/10000), weeks:state.weeks, cred:state.cred, integ:state.integ,
    evidence:state.evidence, winEv:(typeof winEv==="function"?winEv():null), rival:Math.round(state.rivalProgress||0),
    loopUse:state.loopUse, verifyCredits:state.verifyCredits,
    ab:{ jikken:a.jikken, toukei:a.toukei, shidou:a.shidou, hasshin:a.hasshin } };
}
/* Called from pick() AFTER choice.go() mutated state; `before` was snapshotted
   BEFORE go(), `next` is the returned scene id. Records the chosen option, the
   full option set (the alternatives are the "rejected" side of a preference
   pair), the resource deltas the choice caused, and dwell time on the screen. */
function recordDecision(sceneId, scene, idx, choice, before, next){
  if(!telemetryOn() || !scene || !scene.choices || !before) return;
  telSessionStart();
  const after = telSnapshot(), d = {};
  ["evidence","integ","loopUse","cred"].forEach(k=>{ const dv=(after[k]-before[k]); if(dv) d[k]=dv; });
  const db = after.budget-before.budget; if(db) d.budget=db;
  const dw = after.weeks-before.weeks; if(dw) d.weeks=dw;
  // Ground-truth label for the Analyze decision: was the top candidate real or an
  // artifact, and how did the player's read resolve? (feeds the eval harness — see
  // tools/eval-rubric.mjs / docs/SPEC_ja.md §6.2). Hidden from the player in-game.
  let truth;
  try{ if(sceneId==="analyze" && state.rd && state.rd.candidates && state.rd.candidates[0]){
    truth = { topReal: !!state.rd.candidates[0].real, hitOutcome: state.rd.hitOutcome || null }; } }catch(e){}
  telPush({ v:TELEMETRY.ver, sid:telSession(), seq:TELEMETRY._seq++, ts:telNow(), type:"decision",
    scene:sceneId, round:state.round, badge: scene.badge||null,
    theme:state.theme, bg:state.bg, diff:state.diff,
    state_before: before,
    options: scene.choices.map((c,i)=>({ i, t:telText(c.t), tags:(c.cost||[]).map(x=>[x[0], x[1]||""]) })),
    chosen_index: idx, chosen_text: telText(choice.t), truth,
    dwell_ms: Math.max(0, telNow() - (TELEMETRY._t0 || telNow())),
    outcome: { next: next || "round_recap", d } });
}
function recordEnding(endId){
  if(!telemetryOn() || TELEMETRY._endDone) return; TELEMETRY._endDone = true;
  let rank=null, title=null, score=null;
  try{ if(typeof assessRank==="function") rank=assessRank(); }catch(e){}
  try{ if(typeof finalTitle==="function") title=finalTitle(); }catch(e){}
  try{ if(typeof assessScore==="function") score=assessScore(); }catch(e){}
  telPush({ v:TELEMETRY.ver, sid:telSession(), seq:TELEMETRY._seq++, ts:telNow(), type:"ending",
    endId, theme:state.theme, bg:state.bg, diff:state.diff, rank, title, score, state_before: telSnapshot() });
}

const AUDIO = { ctx:null, master:null, muted:false, unlocked:false };  // unlocked = a real user gesture has happened (browsers block audio before that)

function audioInit(){
  if(AUDIO.ctx || typeof window === "undefined") return;
  try{ const AC = window.AudioContext || window.webkitAudioContext; if(!AC) return;
    AUDIO.ctx = new AC(); AUDIO.master = AUDIO.ctx.createGain();
    AUDIO.master.gain.value = 0.32; AUDIO.master.connect(AUDIO.ctx.destination);
  }catch(e){ AUDIO.ctx = null; }
}
function audioResume(){ try{ if(AUDIO.ctx && AUDIO.ctx.state === "suspended") AUDIO.ctx.resume(); }catch(e){} }
function setMuted(m){ AUDIO.muted = !!m; try{ if(LS) LS.setItem("autolab_muted", m ? "1" : "0"); }catch(e){} updateMuteBtn();
  if(m) bgmStop(true); else if(AUDIO.bgmDesired) bgmStart(AUDIO.bgmDesired); }

/* one enveloped oscillator note (optionally pitch-sliding) */
function tone(freq, dur, type, vol, when, slideTo){
  if(!AUDIO.ctx || AUDIO.muted) return;
  const t0 = AUDIO.ctx.currentTime + (when || 0);
  const o = AUDIO.ctx.createOscillator(), g = AUDIO.ctx.createGain();
  o.type = type || "sine"; o.frequency.setValueAtTime(freq, t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.25, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(AUDIO.master); o.start(t0); o.stop(t0 + dur + 0.03);
}
/* short filtered noise burst (alarms/impacts) */
function noise(dur, vol, when){
  if(!AUDIO.ctx || AUDIO.muted) return;
  const t0 = AUDIO.ctx.currentTime + (when || 0);
  const n = Math.max(1, Math.floor(AUDIO.ctx.sampleRate * dur));
  const buf = AUDIO.ctx.createBuffer(1, n, AUDIO.ctx.sampleRate), d = buf.getChannelData(0);
  for(let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = AUDIO.ctx.createBufferSource(); src.buffer = buf;
  const g = AUDIO.ctx.createGain(); g.gain.value = vol || 0.1;
  src.connect(g); g.connect(AUDIO.master); src.start(t0); src.stop(t0 + dur);
}
function arp(freqs, step, dur, type, vol){ freqs.forEach((f, i) => tone(f, dur, type, vol, i * step)); }

const SFX = {
  select:    ()=> tone(520, 0.06, "triangle", 0.16),
  back:      ()=> tone(300, 0.05, "sine", 0.12),
  good:      ()=> { tone(660, 0.08, "triangle", 0.2); tone(880, 0.13, "triangle", 0.2, 0.08); },
  hit:       ()=> arp([523, 659, 784], 0.09, 0.15, "triangle", 0.22),        // false-positive caught / read-win
  bad:       ()=> tone(200, 0.22, "sawtooth", 0.22, 0, 120),                 // burned by an artifact
  coin:      ()=> { tone(988, 0.05, "square", 0.16); tone(1319, 0.1, "square", 0.16, 0.05); },
  gate:      ()=> { tone(160, 0.26, "square", 0.28, 0, 90); noise(0.14, 0.09); },  // fabrication gate
  estop:     ()=> { tone(300, 0.1, "square", 0.24); tone(300, 0.1, "square", 0.24, 0.15); tone(300, 0.1, "square", 0.24, 0.3); },
  objection: ()=> { tone(720, 0.06, "square", 0.26); tone(520, 0.15, "square", 0.26, 0.06, 300); },  // 異議あり！
  break:     ()=> arp([440, 587, 880], 0.08, 0.18, "triangle", 0.24),        // testimony broken
  wrong:     ()=> tone(180, 0.18, "sawtooth", 0.2, 0, 120),
  win:       ()=> arp([523, 659, 784, 1047], 0.12, 0.2, "triangle", 0.24),   // victory jingle
  lose:      ()=> arp([392, 330, 262], 0.16, 0.26, "sine", 0.22),
  rankup:    ()=> arp([659, 880, 1109, 1319], 0.06, 0.16, "triangle", 0.2),   // ability grade up ▲
};
function sfx(name){ if(AUDIO.muted || !AUDIO.unlocked) return; audioInit(); audioResume(); const f = SFX[name]; if(f) try{ f(); }catch(e){} }

/* map a rendered scene to its audio cue */
function sceneSfx(id){
  if(AUDIO.muted) return;
  if(id === "cross"){ const cx = state.cx; if(!cx) return;
    if(cx.fb) sfx(cx.fbGood ? "break" : "wrong"); else if(cx.view === "e") sfx("objection"); return; }
  if(id === "analyze_result"){ const o = state.rd.hitOutcome;
    sfx((o === "verify_real" || o === "verify_caught" || o === "trust_win") ? "hit" : "bad"); return; }

/* ---- ambient BGM: a low-load, continuous drone with a slow breathing LFO ----
   Three moods swap the chord (calm play / tense cross-exam / grim setback).
   Near-zero CPU (a handful of sustained oscillators). Silent on the title and
   endings. Guarded: no-op without an AudioContext. */
AUDIO.bgm = { nodes:[], gain:null, mood:null };
AUDIO.bgmDesired = null;
const BGM_CHORD = {
  title:   [146.83, 220.00, 293.66, 369.99],  // D3 A3 D4 F#4 — open, hopeful (with the major 3rd)
  calm:    [146.83, 220.00, 293.66],           // D3 A3 D4 — open, unhurried
  tense:   [130.81, 155.56, 233.08],           // C3 Eb3 Bb3 — minor unease (cross-exam)
  grim:    [110.00, 130.81, 164.81],           // A2 C3 E3 — low minor (gate / E-stop)
  triumph: [196.00, 293.66, 392.00],           // G3 D4 G4 — bright, resolved (win)
  somber:  [130.81, 155.56, 196.00],           // C3 Eb3 G3 — low, resigned (loss)

/* A sparse melodic layer over the drone — notes cycle a per-mood pattern
   (null = rest) so the bed feels alive without being intrusive. Frequencies
   sit in each mood's key. dur is in ms; volumes are deliberately low. */
const BGM_MELODY = {
  title:   { step:820,  dur:1300, vol:0.05,  notes:[587.33, null, 369.99, null, 440.00, null, 493.88, null, 440.00, null, 587.33, null, null, null, null, null] },

/* one soft, slow-attack pad note for the melody layer (gentle, ambient) */
function padNote(freq, dur, vol){
  if(!AUDIO.ctx || AUDIO.muted || AUDIO.ctx.state !== "running") return;   // don't pile notes while suspended
  const t0 = AUDIO.ctx.currentTime;
  const o = AUDIO.ctx.createOscillator(), g = AUDIO.ctx.createGain();
  o.type = "triangle"; o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.05, t0 + dur * 0.28);       // soft attack
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);                   // long release
  o.connect(g); g.connect(AUDIO.master); o.start(t0); o.stop(t0 + dur + 0.05);
}
function bgmMelodyStart(mood){
  const m = BGM_MELODY[mood]; if(!m || !AUDIO.ctx) return;
  let i = 0;
  const id = setInterval(() => {
    if(AUDIO.muted || !AUDIO.bgm || AUDIO.bgm.mood !== mood) return;       // stale-interval / mute guard
    const f = m.notes[i % m.notes.length]; i++;
    if(f) padNote(f, m.dur / 1000, m.vol);
  }, m.step);
  if(AUDIO.bgm) AUDIO.bgm.seq = id;
}
function bgmStart(mood){
  if(!AUDIO.unlocked) return;                      // wait for a user gesture (no autoplay warnings)
  audioInit(); if(!AUDIO.ctx || AUDIO.muted) return;
  if(AUDIO.bgm.mood === mood && AUDIO.bgm.nodes.length) return;
  bgmStop(true);
  const t = AUDIO.ctx.currentTime, g = AUDIO.ctx.createGain(); g.gain.value = 0; g.connect(AUDIO.master);
  const lfo = AUDIO.ctx.createOscillator(), lfoGain = AUDIO.ctx.createGain();
  lfo.frequency.value = 0.06; lfoGain.gain.value = 0.03; lfo.connect(lfoGain); lfoGain.connect(g.gain); lfo.start();
  const nodes = [lfo];
  (BGM_CHORD[mood] || BGM_CHORD.calm).forEach((f, i) => {
    const o = AUDIO.ctx.createOscillator(), og = AUDIO.ctx.createGain();
    o.type = i === 0 ? "sine" : "triangle"; o.frequency.value = f; og.gain.value = i === 0 ? 0.1 : 0.05;
    o.connect(og); og.connect(g); o.start(); nodes.push(o);
  });
  g.gain.linearRampToValueAtTime(0.12, t + 2);   // gentle fade-in
  AUDIO.bgm = { nodes, gain:g, mood, seq:null };
  bgmMelodyStart(mood);
}
function bgmStop(now){
  const b = AUDIO.bgm;
  if(b && b.seq){ try{ clearInterval(b.seq); }catch(e){} b.seq = null; }
  if(!b || !b.gain || !AUDIO.ctx){ AUDIO.bgm = { nodes:[], gain:null, mood:null }; return; }
  try{ const t = AUDIO.ctx.currentTime;
    if(now){ b.gain.gain.cancelScheduledValues(t); b.gain.gain.setValueAtTime(0, t); }
    else { b.gain.gain.cancelScheduledValues(t); b.gain.gain.linearRampToValueAtTime(0, t + 1.2); }
    const stopAt = t + (now ? 0.03 : 1.3);
    b.nodes.forEach(n => { try{ n.stop(stopAt); }catch(e){} });
  }catch(e){}
  AUDIO.bgm = { nodes:[], gain:null, mood:null };
}
function bgmFor(sceneId){
  if(!sceneId) return null;
  if(sceneId === "title") return "title";                          // a hopeful title theme
  if(sceneId === "end_best" || sceneId === "end_ok") return "triumph";  // win: a warm resolve under the jingle
  if(sceneId.indexOf("end_") === 0) return "somber";               // loss: a low, resigned pad
  if(sceneId === "cross") return "tense";
  if(sceneId === "gate_block" || sceneId === "estop_event") return "grim";
  return "calm";
}
function bgmApply(sceneId){
  if(typeof window === "undefined") return;
  const mood = bgmFor(sceneId); AUDIO.bgmDesired = mood;
  if(AUDIO.muted) return;
  if(!mood) bgmStop(); else bgmStart(mood);
}

function startRound(){ state.round+=1; const carry=state.rd.noiseFromPrev; state.rd={}; if(carry) state.rd.noiseFromPrev=carry;
  // Refill the event pool with the shared events plus ONLY the current theme's bespoke event.
  if(!state.eventPool.length) state.eventPool=shuffle(Object.keys(EVENTS).filter(id=>!EVENTS[id].theme || EVENTS[id].theme===state.theme)); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function themeObj(){ return THEMES[state.theme]; }
function expText(){ const t=themeObj(); return t.steps[Math.min(state.round-1,t.steps.length-1)]; }
function computeZ(){ const rd=state.rd,t=themeObj(); let z=0.15;
  z+=({cited:0.30,deep:0.40,guess:0.05})[rd.protocol]||0.05; z+=rd.controls?0.15:0;
  if(rd.exec==="robot") z+=0.15; else z+=0.05+(rng()*0.15-0.08);
  if(rd.concGood) z+=0.06;
  z+=(state.ab.jikken-50)/450;                 // 実験力（能力値）
  if(hasSkill("seimitsu")) z+=0.08;            // コツ「精密ピペット」
  if(rd.studentBonus) z+=rd.studentBonus;      // 育った後輩の助力
  if(state.tairyoku<15) z-=0.05;               // 疲労でミス
  z-=(t.diff-1)*0.35; if(rd.estopIgnored) z-=0.20; if(rd.contamRisk) z-=0.12; if(rd.lotRisk) z-=0.10;
  return clamp(z,0.02,0.95); }
function milestoneFor(){ if(state.round===3 && !state.flags.ms3) return "milestone_lead"; if(state.round===5 && !state.flags.ms5) return "milestone_valid"; return "daily"; }

const SCENES={};

/* 学びの記録パネル（タイトルに表示）: プレイを重ねて“見抜いた偽陽性”を集める収集要素。
   まだ何も学んでいなければ非表示（初回のネタバレ回避）。ARTIFACT は 72 で定義（実行時に解決）。 */
function codexPanel(){
  const learned = (typeof codexRead==="function") ? codexRead() : [];
  const keys = Object.keys(THEMES), total = keys.length;
  const n = keys.filter(k=>learned.indexOf(k)>=0).length;
  if(n===0) return "";   // 初回は隠す（全テーマの偽陽性を先に並べてしまわない）
  const arts = (typeof ARTIFACT!=="undefined") ? ARTIFACT : {};
  const items = keys.map(k=>{ const t=THEMES[k], got=learned.indexOf(k)>=0;
    return got
      ? `<li class="codex-item got"><span class="codex-dot" style="background:${t.accent||'var(--teal)'}"></span><b>${t.name}</b><span class="codex-art">${arts[k]||'—'}</span></li>`
      : `<li class="codex-item locked"><span class="codex-dot"></span><span class="codex-q">？？？（未遭遇の偽陽性）</span></li>`; }).join("");
  const done = n>=total;
  return `<div class="codex${done?' codex--done':''}"><h3>${done?'✦ ':''}学びの記録 ― 見抜いた偽陽性 <b>${n}/${total}</b></h3>
    <ul class="codex-list">${items}</ul>
    <p class="codex-note">${done?'すべての偽陽性の型を見抜いた ―― 一人前の“疑う目”だ。':'別のテーマを研究すると、新しい偽陽性の型に出会える。'}</p></div>`;
}

function mentorStudent(){
  // 育成度が最も高い後輩に集中投資（一人をエースに育てる）。100 到達済みなら次の子へ。
  const ids=Object.keys(state.students); ids.sort((a,b)=>state.students[b].grow-state.students[a].grow);
  let sid=ids[0]; if(state.students[sid].grow>=100 && state.students[ids[1]]) sid=ids[1];
  const s=state.students[sid];
  const up=Math.max(4, Math.round((13+state.ab.shidou/9)*motFactor()*(1-s.grow/135)));
  s.grow=clamp(s.grow+up,0,100); s.bond=clamp(s.bond+8,0,100);
  const gained=abilityGain("shidou",6);
  let ev=Math.round((5+state.ab.shidou/12)*((hasSkill("mendoumi")||hasSkill("rinsho"))?1.5:1));
  cred(ev); motiv(2); log(`${s.name} を指導（育成度 +${up}・指導力 +${gained}・評価 +${ev}）`,"drama");
  if(s.grow>=60 && !s.helped){ s.helped=true; log(`${s.name} が戦力化：実験の実行を任せられるように`,"win"); }
  let milestone=false;
  if(s.grow>=82 && !s.milestone){ s.milestone=true; state.flags._msStudent=sid; milestone=true; }
  return { s, milestone };
}
function consultTeacher(){
  cred(2); motiv(3);
  if(rng()<0.4){ const pool=["bunkenou","taryoku_baka","kousho","rinsho"].filter(id=>!hasSkill(id));
    if(pool.length){ addSkill(pool[Math.floor(rng()*pool.length)]); log("教授の助言でコツを掴んだ","win"); return; } }
  log("教授に相談（助言で やる気↑）","integ");
}

  loop:"各パラメータに文献の逐語根拠を紐付けられます。根拠のない値のまま実行しようとすると、私が止めます。",
  choices:[
    { t:"出典付き手順を採用する（RAG 検索）", d:"KB から逐語根拠付きの条件を取得。堅実で速い。", cost:[["研究費 -12万","cost"],["時間 -1週","cost"],["整合性 +5","pos"]],
      go(){ money(-120000,"出典付き手順"); weeks(-1); integ(5); loopScore(4); state.rd.protocol="cited"; state.rd.q=hasSkill("bunkenou")?1.08:1.0; if(hasSkill("bunkenou")) integ(2); log("出典付き手順を採用（ループ運用↑）","integ"); return "design_library"; } },
    { t:"文献を精読して自分で裏取りする", d:"時間はかかるが最も堅い。評価も上がる。", cost:[["研究費 -10万","cost"],["時間 -2週","cost"],["整合性 +8","pos"],["評価 +3","pos"]],

/* ---------- TEST ---------- */
SCENES.test_mode=()=>{
  // 戦力化した後輩がいれば実行を任せられる（指導の成果）
  let helper=null; for(const id in state.students){ const s=state.students[id]; if(s.grow>=60 && (!helper || s.grow>helper.grow)) helper=s; }
  const ch=[
    { t:"Opentrons ロボットで自分が実行する", d:"分注が安定し QC が上がる。逸脱時は E-stop で保護。体力を使う。", cost:[["研究費 -35万","cost"],["時間 -1週","cost"],["体力 -","cost"],["QC +","pos"]],
      go(){ money(-350000,"ロボット実行"); weeks(-1); spendStamina(14); loopScore(3); state.rd.exec="robot"; log("Opentrons で実行（ループ運用↑）","integ"); if(rng()<0.45) return "estop_event"; state.rd.z=computeZ(); return "qc"; } },
    { t:"手動 HTS で自分が実行する", d:"安いが遅く、ばらつきが出る。体力を大きく使う。", cost:[["研究費 -18万","cost"],["時間 -2週","cost"],["体力 --","cost"],["ばらつき","risk"]],
      go(){ money(-180000,"手動 HTS"); weeks(-2); spendStamina(20); loopScore(-1); state.rd.exec="manual"; state.rd.z=computeZ(); log("手動 HTS で実行（系外・やや非効率）"); return "qc"; } },
  ];
  if(helper){ ch.push({ t:`後輩の ${helper.name} に実行を任せる`, d:`育てた後輩が実行。あなたの体力を使わず、評価も上がる。育成度が高いほど QC も安定。`, cost:[["研究費 -30万","cost"],["時間 -1週","cost"],["評価 +3","pos"],["体力 温存","pos"]],
      go(){ money(-300000,"後輩に実行を委任"); weeks(-1); helper.bond=clamp(helper.bond+5,0,100); cred(3); abilityGain("shidou",2); loopScore(2);
            state.rd.exec="robot"; state.rd.studentRun=true; state.rd.studentBonus=clamp((helper.grow-60)/300,0,0.1); state.rd.z=computeZ();
            log(`${helper.name} に実行を委任（評価 +3・体力温存）`,"drama"); return "qc"; } }); }
  return { badge:`TEST ― R${state.round}`, badgeClass:"test", figure:"test", title:"アッセイの実行方法",
    body:`<p><em>Opentrons ロボット</em>なら分注が安定するが機器コストがかかる。<em>手動 HTS</em>は安いが、ばらつきと時間が増える。${helper?`<br>そして今は ―― 育てた <em>${helper.name}</em> に任せるという手もある。`:""}</p>`,
    loop: helper?"後輩が戦力化しました。実行を任せれば、あなたは体力を温存でき、育成の評価も積み上がります。":"ロボット実行中は逸脱を常時監視し、危険を検知したら E-stop で止めます。復帰は承認制です。",
    choices:ch }; };
SCENES.estop_event=()=>({ badge:"E-STOP", badgeClass:"test", figure:"estop", title:"逸脱を検知 ― 安全停止がラッチ",
  body:`<p>無人運転の途中、アラート。</p><div class="fig"><b>検知：</b>チップ位置ずれ（想定エンベロープ外のモーション）。<b>E-stop が自動でラッチ</b>し後続分注を遮断。プレートはまだ生きている。</div>`,
  loopGate:true, loop:"E-stop ラッチ済み。原因を確認して承認すれば安全に復帰、無視して続けると分注が崩れます。",
  choices:[
    { t:"停止を承認 → 原因を確認して復帰する", d:"正攻法。プレートを救い、対応を trail に残す。", cost:[["時間 -1週","cost"],["評価 +2","pos"],["ループ運用↑","pos"]], go(){ weeks(-1); cred(2); loopScore(4); state.rd.z=computeZ(); log("E-stop 承認・確認して復帰（ループ運用↑）","estop"); return "qc"; } },
    { t:"アラートを無視して続行させる（安全系を軽視）", d:"時間は稼げるがプレートが崩れ、教授の信頼も損なう。", cost:[["整合性 -5","neg"],["QC 悪化","neg"],["ループ運用↓↓","neg"]], go(){ integ(-5); loopScore(-8); state.rd.estopIgnored=true; state.rd.z=computeZ(); log("E-stop 無視で続行（安全系軽視・ループ運用↓）","integ"); return "qc"; } },
  ] });

/* ---------- QC ---------- */
SCENES.qc=()=>{ const z=state.rd.z!=null?state.rd.z:(state.rd.z=computeZ()); const pass=z>=0.5, zStr=z.toFixed(2);
  if(!state.rd._qcLogged){ log(`QC：Z-factor = ${zStr}（${pass?'合格':'不合格'}）`, pass?"integ":"gate"); state.rd._qcLogged=true; }
  return { badge:`QC ― R${state.round}`, badgeClass:"test", figure:"gauge", title:`プレート QC：Z-factor = ${zStr}`,
    body:`<p>リーダーの生データを取り込むと、ループが即座に QC を計算した。</p>
      <div class="fig"><b>Z-factor：</b>${zStr} ／ 判定基準 0.5<br><b>結果：</b>${pass?'<b style="color:var(--green)">合格</b> ―― アッセイウィンドウは十分。解析へ。':'<b style="color:var(--warn)">不合格</b> ―― 対照分離が足りず、このまま解析すると信用できない。'}</div>`,
    loop: pass?`Z-factor ${zStr}。QC 合格として監査 trail に記録しました。`:`Z-factor ${zStr}。QC 不合格です。対照を見直して再実行が定石ですが、判断はあなたに委ねます。`,
    choices: pass?[{ t:"データレビューへ進む", cost:[["QC 合格","pos"]], go(){ makeCandidates(); return "analyze_review"; } }]
      :[{ t:"対照を見直してプレートを再実行する", d:"堅実。コストはかかるが Z を立て直す。", cost:[["研究費 -22万","cost"],["時間 -2週","cost"],["QC 改善","pos"]],
          go(){ money(-220000,"QC やり直し"); weeks(-2); state.rd.controls=true; state.rd.exec="robot"; loopScore(3); state.rd.z=clamp(computeZ()+0.15,0.02,0.95); state.rd._qcLogged=false; state.rivalProgress+=4; log("QC 立て直しのため再実行（ループ運用↑）"); return "qc"; } },
        { t:"この不合格データで無理に解析へ進む", d:"賭け。エビデンスは薄く整合性も落ちる。", cost:[["整合性 -12","neg"],["エビデンス減","neg"]],
          go(){ integ(-12); loopScore(-8); state.rd.qcForced=true; makeCandidates(); log("QC 不合格のまま強行（整合性・ループ運用↓）","integ"); return "analyze_review"; } }] }; };

/* Generate this round's candidate hits with a HIDDEN truth. The player is NOT
   told which are real vs artifacts; they must read the noisy readout, weigh a
   統計力-dependent hint, and decide whether to pay for a counter-screen or gamble.
   Runs in a go() (uses rng) so it stays save-safe; results live in rd. */
function makeCandidates(){
  if(state.rd.candidates) return;
  const code = String.fromCharCode(65 + ((state.round - 1) % 8));  // A,B,C...
  const tag = ({ sglt2:"SGLT2", tnf:"TNF", tdp1:"TDP1", glp1:"GLP1", kinase:"ABL", abx:"ABX", gpcr:"GPCR" })[state.theme] || "CMPD";
  // Round 1 is the scripted teaching case: the flashiest hit is an artifact.
  // Bolder strategies produce a flashier top readout but more false positives.
  const pReal = ({ safe:0.74, focused:0.60, bold:0.44 })[state.rd.strat] || 0.60;
  const topReal = state.round === 1 ? false : (rng() < pReal);
  const r = () => Math.round(rng() * 100) / 10;                    // 0.0–10.0 jitter
  const cands = [
    { name:`${tag}-${code}1`, readout: 74 + Math.round(rng()*16), real: topReal },
    { name:`${tag}-${code}2`, readout: 52 + Math.round(rng()*16), real: rng() < 0.55 },
    { name:`${tag}-${code}3`, readout: 28 + Math.round(rng()*16), real: false },
  ];
  state.rd.candidates = cands;
  // A statistical read on the TOP candidate — accurate in proportion to 統計力.
  const acc = clamp(0.5 + state.ab.toukei / 250, 0.5, 0.95);
  state.rd.hintAcc = Math.round(acc * 100);
  state.rd.hintClean = (rng() < acc) ? cands[0].real : !cands[0].real;   // may mislead
}

/* ---------- ANALYZE 1: データレビュー ---------- */
function afterReview(){ if(state.round===1 && !state.flags.doubt1){ state.flags.doubt1=true; setupCross("self"); return "cross"; } return "analyze"; }

  loop:"外れ値の扱いも trail に残ります。除外には理由が要る ―― 都合で消したデータは、あとで必ず問われます。",

    { t:"時間優先でざっとレビューする", d:"速いが取りこぼしがある。", cost:[["伸び控えめ","cost"]], go(){ state.rd.reviewMult=0.92; log("データをざっとレビュー"); return afterReview(); } },
    { t:"都合の悪い外れ値を理由なく除外する", d:"見栄えは良くなるが、これは体裁づくり。整合性を削る。", cost:[["エビデンス +","pos"],["整合性 -12","neg"],["リスク","risk"]], go(){ integ(-12); loopScore(-6); state.rd.reviewMult=1.14; state.rd.cherry=true; log("理由のない外れ値除外（整合性・ループ運用↓）","gate"); return afterReview(); } },
  ] });

/* ---------- ANALYZE 2: ヒット判定（隠れた真実＋読み） ---------- */
const ARTIFACT = { sglt2:"凝集（コロイド）", tnf:"細胞毒性", tdp1:"発光干渉", glp1:"自家蛍光", kinase:"レドックス干渉", abx:"光学干渉（着色・沈殿）", gpcr:"蛍光クエンチング（消光）" };
SCENES.analyze=()=>{ const rd=state.rd;
  const cands = rd.candidates || [{ name:"CMPD-A1", readout:72, real:true }];
  const top = cands[0], artName = ARTIFACT[state.theme] || "干渉";
  const hintAcc = rd.hintAcc || 70;
  const clean = (rd.hintClean !== undefined) ? rd.hintClean : true;
  const rows = cands.map((c,i)=>`<div style="display:flex;align-items:center;gap:.5rem;margin:.25rem 0">
      <span style="width:5.5em;font-family:var(--serif)">${c.name}</span>
      <span style="flex:1;height:10px;background:var(--paper-alt);border-radius:5px;overflow:hidden"><i style="display:block;height:100%;width:${c.readout}%;background:${i===0?"var(--hit)":"var(--teal)"}"></i></span>
      <span style="width:3.2em;text-align:right;font-size:.85rem">${c.readout}%</span></div>`).join("");
  const hint = clean
    ? `統計力による所見：最有力の <b>${top.name}</b> は<b style="color:var(--green)">クリーンに見える</b>（この所見の信頼度 約 ${hintAcc}%）`
    : `統計力による所見：最有力の <b>${top.name}</b> に<b style="color:var(--warn)">${artName}の兆候</b>＝偽陽性かもしれない（信頼度 約 ${hintAcc}%）`;
  const credits = state.verifyCredits!=null ? state.verifyCredits : 3;
  const ch = [];
  if(credits > 0){
    ch.push({ t:`カウンタースクリーンで確かめてから前進する（残り ${credits} 回）`, d:"確実に偽陽性を弾ける。だが検査キットは有限 ―― 全ラウンドは確かめられない。どこで使うかが勝負。", cost:[["確認 -1 回","cost"],["研究費 -12万","cost"],["整合性 +3","pos"],["確実","pos"]],
      go(){ state.verifyCredits--; money(-120000,"カウンタースクリーン"); loopScore(3); abilityGain("toukei",2); finishAnalyze("verify"); return "analyze_result"; } });
  }
  ch.push({ t:"読みを信じて最有力株を前進させる", d:"検査を使わず前進。本物なら大きく前進、偽陽性なら次ラウンドに響く。統計力の所見が信頼できるなら、これが正着。", cost:[["確認を温存","pos"],["エビデンス 効率↑↑","pos"],["賭け","risk"]],
    go(){ finishAnalyze("trust"); return "analyze_result"; } });
  ch.push({ t:"結果を“盛って”良く見せて報告する", d:"今すぐ数字は伸びるが、これは捏造。投稿時に露見しうる。", cost:[["エビデンス +大","pos"],["整合性 -30","neg"],["撤回リスク","risk"]],
    go(){ loopScore(-15); finishAnalyze("fabricate"); return "analyze_result"; } });
  return { badge:`ANALYZE・判定 ― R${state.round}`, badgeClass:"analyze", figure:"bars", title:"どの候補を、どこまで信じる？",
    body:`<p>readout（見かけの阻害率）は出た。だが ―― <em>見かけの活性は、本物とは限らない</em>（${artName}による偽陽性が紛れる）。どれが本物かは、まだ確定していない。</p>
      <div class="fig">${rows}<div style="margin-top:.5rem;border-top:1px solid var(--rule);padding-top:.5rem">${hint}<br><span style="font-size:.82rem;color:var(--ink-muted)">カウンタースクリーン残り <b>${credits}</b> 回 ―― 疑わしいラウンドに温存し、読み切れるラウンドは確認を使わず前進するのが上手い立ち回り。</span></div></div>`,
    loop: credits>0 ? "確認キットは有限です。統計力が高いほど所見が信頼でき、確認を使わず読み切れます。怪しいと見た時こそ、確認を切ってください。"
                    : "確認キットは尽きました。ここからは統計力の読みが頼り ―― 所見を信じて進むしかありません。",
    choices:ch }; };
function finishAnalyze(mode){ const t=themeObj(),rd=state.rd; const z=rd.z!=null?rd.z:computeZ(), zPass=z>=0.5 && !rd.qcForced;
  let base=22; base*=(rd.q||0.6); base*= zPass?1.0:0.4; base*= rd.controls?1.0:0.75;
  base*=(rd.stratMult||1)*(rd.libMult||1)*(rd.reviewMult||1);
  base*=(1+(state.ab.toukei-50)/220);          // 統計力（能力値）
  base*=motFactor();                            // やる気
  if(hasSkill("toukei_me")) base*=1.12;         // コツ「統計の申し子」
  base*=curDiff().evMult;                        // 難易度
  base*=(1 + ((state.loopUse!=null?state.loopUse:62)-60)/300);  // Autolab Loop を正しく使うほど効率的・成果が出る
  base/=t.diff;
  const top = rd.candidates ? rd.candidates[0] : null;
  rd.hitOutcome = null;
  if(mode==="verify" || mode==="clean"){ cred(3); integ(3); motiv(3);
    if(top && !top.real){ rd.hitOutcome="verify_caught"; base*=0.92; }  // top was fake — you advanced a solid secondary
    else rd.hitOutcome="verify_real"; }
  else if(mode==="trust"){ if(top && !top.real){ base*=0.35; integ(-4); loopScore(-2); motiv(-5); rd.noiseCarry=true; rd.hitOutcome="trust_burn"; }
    else { base*=1.2; motiv(4); rd.hitOutcome="trust_win"; } }
  else if(mode==="greedy"){ base*=0.8; rd.noiseCarry=true; rd.hitOutcome="greedy"; }
  else if(mode==="fabricate"){ base=base*0.9+40; integ(-30); motiv(-5); state.fabricated=true; rd.hitOutcome="fabricate"; log("結果を水増しして報告（捏造フラグ）","gate"); }
  if(rd.doubtWin) base*=1.08;                   // 偽陽性を見抜いた（反対尋問）
  if(rd.doubtLose){ base*=0.9; rd.noiseCarry=true; }  // 偽陽性を掴んだ
  if(rd.noiseFromPrev) base*=0.85;
  const gain=Math.max(4,Math.round(base)); rd.gain=gain; evidence(gain); log(`解析完了：エビデンス +${gain}（累計 ${state.evidence}）`,"win");
  state._noiseNext = rd.noiseCarry===true; }
SCENES.analyze_result=()=>{ const rd=state.rd, gain=rd.gain||0;
  const M = ({
    verify_real:{ ttl:"本物のヒットを確保 ✓", col:"var(--green)", msg:`最有力株はカウンタースクリーンも通過。<b>再現性のある本物のヒット</b>を確保した。`, good:true },
    verify_caught:{ ttl:"疑って、正解だった ✓", col:"var(--green)", msg:`最有力株は<b>偽陽性</b>だった ―― 見かけの活性に飛びつかず確かめたおかげで、堅実な本物に乗り換えられた。<em>結果を疑う姿勢が、身を助けた。</em>`, good:true },
    trust_win:{ ttl:"読み勝ち！", col:"var(--teal)", msg:`賭けは当たり。最有力株は本物で、検証コストを払わず前進できた。<b>データを読み切る目</b>が効いている。`, good:true },
    trust_burn:{ ttl:"偽陽性を掴んだ…", col:"var(--warn)", msg:`確かめずに飛びついた最有力株は<b>偽陽性</b>だった。次ラウンドに尾を引く。<em>見かけの活性は、本物とは限らない。</em>`, good:false },
    greedy:{ ttl:"欲張って拾った", col:"var(--gold)", msg:`偽陽性混じりで前進。次ラウンドが重くなる。`, good:false },
    fabricate:{ ttl:"報告を“盛った”", col:"var(--warn)", msg:`数字は伸びたが、生データとの乖離は監査 trail に残っている。`, good:false },
  })[rd.hitOutcome] || { ttl:"解析完了", col:"var(--ink)", msg:"", good:false };
  return { badge:`ANALYZE 結果 ― R${state.round}`, badgeClass:"analyze", figure:"bars", title:M.ttl,
    body:`<p style="color:${M.col};font-weight:600">${M.msg}</p><div class="fig">エビデンス <b>+${gain}</b>（累計 ${state.evidence} / ${winEv()}）</div>`,

    choices:[{ t:"次の一手へ", cost:[[M.good?"好手":"教訓", M.good?"pos":"cost"]], go(){ return "postAnalyze"; } }] }; };

function setupCross(id){ const d=CROSS[id]();
  state.cx={ id, phase:0, stmt:0, view:"t", pen:Math.max(2,(d.penalty||5)+(curDiff().cxBonus||0)),
    pressed:{}, solved:[], unlocked:[], fb:"", fbGood:false, showLead:true }; }

function crossPress(){ const d=CROSS[state.cx.id](), cx=state.cx, ph=d.phases[cx.phase], st=ph.statements[cx.stmt];
  cx.pressed[cx.phase+":"+cx.stmt]=true; cx.fb=""; cx.fbGood=false; cx.showLead=false;
  if(st.unlock && cx.unlocked.indexOf(st.unlock)<0){ cx.unlocked.push(st.unlock);
    const e=d.evidence.find(x=>x.id===st.unlock);
    cx.fb=`◆ 証拠を入手：<b>${e?e.name:st.unlock}</b> ―― 記録に追加した。`; cx.fbGood=true;
    log("反対尋問：ゆさぶりで新証拠を入手","drama"); }
  return "cross"; }

function crossPresent(eid){ const d=CROSS[state.cx.id](), cx=state.cx, ph=d.phases[cx.phase], i=cx.stmt;
  const sol=(ph.solutions||[]).find(s=>s.stmt===i && s.evi===eid && cx.solved.indexOf(i)<0);
  if(sol){ cx.solved.push(i); cx.view="t"; cx.fb=""; cx.fbGood=false;
    if((ph.solutions||[]).every(s=>cx.solved.indexOf(s.stmt)>=0)){
      if(ph.onBreak) ph.onBreak();
      if(cx.phase+1 < d.phases.length){ loopScore(1); cx.phase++; cx.stmt=0; cx.solved=[]; cx.showLead=true;
        cx.fb=ph.breakMsg||"…証言が崩れた。相手は新しい言い分を並べ始めた。"; cx.fbGood=true;
        log(`反対尋問：証言の層を突破（${cx.phase}/${d.phases.length-1}）`,"drama"); return "cross"; }
      loopScore(2); if(d.onWin) d.onWin(); log(d.winLog||"反対尋問：真実を暴いた","win"); return d.win;
    }
    cx.fb=ph.partialMsg||"…食い違いを一つ突いた。まだ隠している。"; cx.fbGood=true; log("反対尋問：矛盾を一点指摘","drama"); return "cross"; }
  cx.pen--; cx.view="t"; cx.fbGood=false;
  cx.fb=(ph.near&&ph.near[eid])||(d.near&&d.near[eid])||d.wrongMsg||"…決め手にならない。証言とは食い違わない。";
  cred(-1); motiv(-2);
  if(cx.pen<=0){ if(d.onLose) d.onLose(); return d.lose; }
  return "cross"; }

SCENES.cross=()=>{ const d=CROSS[state.cx.id](), cx=state.cx, ph=d.phases[cx.phase], st=ph.statements[cx.stmt];
  const pen="●".repeat(Math.max(0,cx.pen))+"○".repeat(Math.max(0,(d.penalty||5)-cx.pen));
  const avail=d.evidence.filter(e=> !e.hidden || cx.unlocked.indexOf(e.id)>=0);
  const fbBox = cx.fb ? `<div class="fig" style="border-color:${cx.fbGood?'var(--green)':'var(--warn)'};color:${cx.fbGood?'var(--green)':'var(--warn)'}">${cx.fb}</div>` : "";
  // Witness reacts: shocked when a contradiction just landed, smug when you missed.
  const spk=CX_SPK[cx.id]||"sakura";
  let mood = cx.fb ? (cx.fbGood?"shock":"confident") : "talk";
  const slk = mood==="shock" ? "burst" : "focus";
  if(cx.view==="e"){
    return { badge:d.badge||"反対尋問", badgeClass:"event", speaker:spk, mood: cx.fb?mood:"think", sl:"focus", title:d.title,
      body:`<p><b>いま追及中の証言：</b>「${st.text}」</p><p>この証言と食い違う<em>証拠</em>を突きつけろ。関係ない証拠を出すと自信を削られる。</p>${fbBox}`,
      loop:d.loopE||"証言と矛盾する証拠を選べば、ほころびを暴けます。",
      choices:[ ...avail.map(e=>({ t:`◆ ${e.name}`, d:e.desc, go:()=>crossPresent(e.id) })), { t:"◀ 証言に戻る", go:()=>{ cx.view="t"; cx.fb=""; return "cross"; } } ] };
  }
  const pressTxt = cx.pressed[cx.phase+":"+cx.stmt]&&st.press ? `<div class="fig"><b>ゆさぶり：</b>${st.press}</div>` : "";
  const solvedMark = cx.solved.indexOf(cx.stmt)>=0 ? ' <span style="color:var(--green)">✓崩した</span>' : '';
  const leadTxt = cx.showLead ? (ph.lead ? `<p>${ph.lead}</p>` : (cx.phase===0 && d.intro ? `<p>${d.intro}</p>` : "")) : "";
  const phaseTag = d.phases.length>1 ? `　／　尋問 <b>${cx.phase+1}/${d.phases.length}</b>層` : "";
  return { badge:d.badge||"反対尋問", badgeClass:"event", speaker:spk, mood, sl:slk, title:d.title,
    body:`${leadTxt}
      <div class="cx-bar">証言 ${cx.stmt+1}/${ph.statements.length}${solvedMark}${phaseTag}　／　自信 <span class="cx-pen">${pen}</span></div>
      <div class="cx-testimony">${d.whoName?`<span class="cx-who">${d.whoName}</span>`:""}「${st.text}」</div>
      ${pressTxt}${fbBox}`,
    loop:d.loop||"証言を《ゆさぶって》糸口を探し（新証拠が出ることも）、確信したら《証拠を突きつけろ》。一つ崩すと相手は新たな証言を並べてくる。",
    choices:[
      { t:"◆ 証拠を突きつける（異議あり！）", d:"この証言に矛盾する証拠を提示する", go:()=>{ cx.view="e"; cx.fb=""; cx.showLead=false; return "cross"; } },
      { t:"❓ ゆさぶる", d:"この証言を追及して糸口を探る（新証拠が出ることも）", go:()=>crossPress() },
      { t:"▶ 次の証言へ", go:()=>{ cx.stmt=(cx.stmt+1)%ph.statements.length; cx.fb=""; cx.showLead=false; return "cross"; } },
      { t:"◀ 前の証言へ", go:()=>{ cx.stmt=(cx.stmt-1+ph.statements.length)%ph.statements.length; cx.fb=""; cx.showLead=false; return "cross"; } },
    ] };
};

SCENES.round_recap=()=>{
  if(!state.rd._rivalDone){ state.rivalProgress=clamp(state.rivalProgress+rivalStep(),0,120); state.rd._rivalDone=true; }
  let dest;
  if(state.integ<=0) dest="end_retract";
  else if(state.weeks<=0) dest="end_timeout";
  else if(state.budget<0) dest="end_broke";
  else if(shouldFire()) dest="end_fired";
  else if(state.rivalProgress>=100 && !state.flags.scooped && state.evidence<winEv()) dest="scoop_event";
  else if(state.evidence>=winEv() && !state.confirmed) dest="endgame_confirm";
  else if(reviewDue()) dest="prof_review";
  else dest="next_round";
  const evPct=Math.round(clamp(state.evidence/winEv()*100,0,100));
  let msg;
  if(dest==="next_round") msg=`<p>Round ${state.round} を終えた。エビデンス <b>${state.evidence} / ${winEv()}</b>（${evPct}%）。有馬ラボは <b>${Math.round(state.rivalProgress)}%</b>。まだ足りない ―― loop は次の Design を提案している。</p>`;
  else if(dest==="scoop_event") msg=`<p>Round ${state.round} 終了。だが ―― 競合の足音が、すぐ後ろまで来ている。</p>`;
  else if(dest==="endgame_confirm") msg=`<p>エビデンスが <b>${state.evidence}</b> に到達。霧島教授「ここまで来たな。あとは <em>用量反応で本当に効くのか</em> を確定させれば論文にできる。」</p>`;
  else if(dest==="prof_review") msg=`<p>Round ${state.round} 終了。廊下で霧島教授に呼び止められた ―― 「少し、話がある。」</p>`;
  else if(dest==="end_fired") msg=`<p>Round ${state.round} 終了。だが研究室の空気が、ひどく重い ――</p>`;
  else msg=`<p>ラウンドの区切り。状況を確認しよう。</p>`;
  return { badge:`Round ${state.round} 総括`, badgeClass:"story", figure:"pipeline", title:"ラウンド総括",
    body:`${msg}<div class="fig">研究費 <b>${Math.round(state.budget/10000)}万円</b> ／ 残り <b>${Math.max(0,state.weeks)}週</b> ／ 評価 <b>${state.cred}</b> ／ 整合性 <b>${state.integ}</b><br>エビデンス <b>${state.evidence} / ${winEv()}</b> ／ 競合 <b>${Math.round(state.rivalProgress)}%</b></div>`,
    loop: dest==="next_round"?"次ラウンドの Design を用意しました。前ラウンドの選択が QC とエビデンスに反映されています。":"総括を監査 trail に記録しました。",
    choices:[{ t: dest==="next_round"?"次のラウンドへ進む":dest==="scoop_event"?"何が起きた？":dest==="endgame_confirm"?"最終確認実験（用量反応）へ":dest==="prof_review"?"霧島教授との面談へ":dest==="end_fired"?"……教授室へ":"結末を見る",
      cost: dest==="next_round"?[["続行","pos"]]:[["…","cost"]],

/* ---- 76-scenes-mgmt.js ---- */
const MGMT = {
  targetValuation: 1000000000,   // 企業価値 10億で「大型化（IPO/大型買収）」＝勝利
  maxQuarters: 28,               // 7年で決着（届かねば stagnation ―― それも一つの結末）
  startCash: 40000000, startEquip: 30000000,
  salaryPer: 2000000,            // 研究者1人あたり人件費 / 四半期
  reagentPer: 1200000,           // 研究者1人あたり試薬・消耗品 / 四半期（loop で効率化）
  loopOpexPer: 800000,           // loopTier あたり運用費 / 四半期
  deprRate: 0.05,                // 四半期 5% の減価償却
  taxRate: 0.30,
  grantBase: 3900000,            // 助成金の基礎額
  licensePer: 4200000,           // パイプライン1本あたりライセンス収入
  saasPer: 1900000,              // Autolab Loop（自社SaaS）収入 / loopTier ―― loop 投資の主な見返り
  hireCost: 3000000, capexCost: 12000000, loopUpCost: 15000000,
  mktCost: 6000000, pipeCost: 10000000, loanAmt: 20000000, repayAmt: 10000000,
};

function effLoop(){ return 1 + 0.24 * ((state.mgmt ? state.mgmt.loopTier : 1) - 1); }  // loop 効率倍率（インフレ耐性の源）
function mgmtEquity(){ const m = state.mgmt; return m.capital + m.retained; }
function mgmtAssets(){ const m = state.mgmt; return m.cash + m.equipment; }
function mgmtValuation(){ const m = state.mgmt; const ni = m.pl ? m.pl.net : 0;
  // 主に純資産（積み上げた net worth）＋控えめな利益倍率。地道に黒字を積むほど伸びる。
  return Math.round(mgmtEquity() + Math.max(0, ni) * 8 + m.pipeline * 15000000 + (m.reputation - 50) * 300000); }

function mgmtInit(){
  state.mgmt = {
    quarter: 1, cash: MGMT.startCash, equipment: MGMT.startEquip, debt: 0,
    capital: MGMT.startCash + MGMT.startEquip, retained: 0,
    staff: 4, loopTier: 1, reputation: 52, pipeline: 1,
    rate: 0.5, cpi: 100, grantClimate: 1.0, marketingStock: 0,
    pl: null, history: [], bustStreak: 0, won: false, lost: false, lastAction: "",
    pendStaff: 0, pendExpense: 0, pendCapex: 0, pendDebt: 0, pendLoop: 0, pendPipe: 0,
  };
}
function mgmtClearPend(){ const m = state.mgmt; m.pendStaff = m.pendExpense = m.pendCapex = m.pendDebt = m.pendLoop = m.pendPipe = 0; }

/* Advance one fiscal quarter: compute the P/L on the CURRENT capacity, apply
   this quarter's discretionary spend, then update the balance sheet + macro and
   let the pending growth (hires/loop/pipeline) take effect next quarter. Runs in
   a go() (uses rng) so it stays save-safe. The books balance by construction:
   Δassets = net + Δdebt = Δequity + Δliabilities. */
function mgmtRunQuarter(){
  const m = state.mgmt, cpiF = m.cpi / 100, eff = effLoop(), repF = m.reputation / 50, subF = 1 + m.marketingStock / 40;
  // 収益
  const grants = MGMT.grantBase * Math.pow(m.staff, 0.75) * m.grantClimate * Math.sqrt(Math.max(0.3, repF)) * eff;
  const demand = clamp(1.15 - m.rate * 0.05, 0.6, 1.2);           // 高金利は製薬の導入意欲を冷やす
  const licensing = MGMT.licensePer * m.pipeline * repF * demand;
  const saas = MGMT.saasPer * m.loopTier * repF * subF;
  const revenue = grants + licensing + saas;
  // 費用（物価で膨らみ、loop 効率で試薬コストが下がる）
  const salaries = m.staff * MGMT.salaryPer * cpiF;
  const reagents = m.staff * MGMT.reagentPer * cpiF / eff;
  const loopOpex = m.loopTier * MGMT.loopOpexPer * cpiF;
  const depreciation = m.equipment * MGMT.deprRate;
  const interest = m.debt * (m.rate / 100);
  const discretionary = m.pendExpense;                            // 採用/マーケ/loop/パイプラインの当期費用
  const pretax = revenue - salaries - reagents - loopOpex - depreciation - interest - discretionary;
  const tax = pretax > 0 ? pretax * MGMT.taxRate : 0;
  const net = pretax - tax;
  // 現金・貸借の更新
  m.cash += net + depreciation - m.pendCapex + m.pendDebt;        // 営業CF(減価償却足戻し) − 設備投資 + 財務
  m.equipment += m.pendCapex - depreciation;
  m.debt += m.pendDebt;
  m.retained += net;
  m.pl = { revenue, grants, licensing, saas, salaries, reagents, loopOpex, depreciation, interest, discretionary, pretax, tax, net };
  m.history.push(Math.round(net));
  // 成長は翌期から効く
  m.staff += m.pendStaff; m.loopTier += m.pendLoop; m.pipeline += m.pendPipe;
  // 評判：黒字は少し上向き、放置は下がる
  m.reputation = clamp(m.reputation + (net > 0 ? 1 : -1.5) - 0.4, 5, 100);
  m.marketingStock = Math.max(0, m.marketingStock * 0.85);
  mgmtMacroStep();
  mgmtClearPend();
  // 勝敗
  if (m.cash < 0) m.bustStreak++; else m.bustStreak = 0;
  if (mgmtValuation() >= MGMT.targetValuation) m.won = true;
  else if (m.bustStreak >= 2 || mgmtEquity() < 0) m.lost = true;
  m.quarter++;
}
function mgmtMacroStep(){ const m = state.mgmt;
  const infl = clamp(0.006 + (rng() - 0.40) * 0.012, -0.002, 0.025);      // 物価：0〜2.5%/Q（じわじわ上がる）
  m.cpi *= (1 + infl);
  const target = clamp(0.5 + (m.cpi - 100) * 0.11, 0.1, 7.0);             // 中銀は物価に強めに反応して利上げ
  m.rate = clamp(m.rate + (target - m.rate) * 0.3 + (rng() - 0.5) * 0.2, 0.1, 8);
  m.grantClimate = clamp(1.15 - m.rate * 0.07 + (rng() - 0.5) * 0.06, 0.5, 1.3);   // 金融引締めは助成も細らせる
}

/* ---------- 表示ヘルパ ---------- */
function yen(v){ v = Math.round(v); const a = Math.abs(v), s = v < 0 ? "-" : "";
  if (a >= 100000000) return s + "¥" + (a / 100000000).toFixed(2) + "億";
  if (a >= 10000) return s + "¥" + Math.round(a / 10000) + "万";
  return s + "¥" + a; }
function mgmtDash(){ const m = state.mgmt; if (!m) return "";
  const val = mgmtValuation(), pct = clamp(val / MGMT.targetValuation * 100, 0, 100);
  return `<div class="mgmt-dash">
    <div class="mgmt-kpis">
      <span><b>Q${m.quarter}</b> / ${MGMT.maxQuarters}</span>
      <span>現金 <b>${yen(m.cash)}</b></span>
      <span>純資産 <b>${yen(mgmtEquity())}</b></span>
      <span>研究者 <b>${m.staff}名</b></span>
      <span>Loop <b>Lv${m.loopTier}</b></span>
      <span>評判 <b>${Math.round(m.reputation)}</b></span>
      <span>政策金利 <b>${m.rate.toFixed(2)}%</b></span>
      <span>物価 <b>${m.cpi.toFixed(0)}</b></span>
    </div>
    <div class="mgmt-goal"><span>企業価値 <b>${yen(val)}</b> / 目標 ${yen(MGMT.targetValuation)}</span>
      <span class="mgmt-goalbar"><i style="width:${pct}%"></i></span></div>
  </div>`; }
function mgmtStatement(){ const m = state.mgmt; if (!m) return "";
  const p = m.pl;
  if (!p) return `<div class="fig">まだ決算前です。最初の四半期を回すと、損益計算書と貸借対照表がここに出ます。</div>`;
  const row = (k, v, cls) => `<div class="pl-row ${cls || ''}"><span>${k}</span><span>${yen(v)}</span></div>`;
  const pl = `<div class="stmt"><h4>損益計算書（当四半期）</h4>
      ${row("売上高", p.revenue, "head")}
      <div class="pl-sub">${row("　助成金", p.grants)}${row("　ライセンス", p.licensing)}${row("　Autolab Loop（SaaS）", p.saas)}</div>
      ${row("人件費", -p.salaries)}${row("試薬・消耗品", -p.reagents)}${row("Loop 運用費", -p.loopOpex)}
      ${row("減価償却", -p.depreciation)}${row("支払利息", -p.interest)}${p.discretionary ? row("成長投資（当期費用）", -p.discretionary) : ""}
      ${row("税引前利益", p.pretax, "head")}${row("法人税", -p.tax)}
      ${row("当期純利益", p.net, p.net >= 0 ? "net pos" : "net neg")}</div>`;
  const bs = `<div class="stmt"><h4>貸借対照表</h4>
      ${row("資産の部", mgmtAssets(), "head")}
      <div class="pl-sub">${row("　現金", m.cash)}${row("　設備（簿価）", m.equipment)}</div>
      ${row("負債の部", m.debt, "head")}<div class="pl-sub">${row("　借入金", m.debt)}</div>
      ${row("純資産の部", mgmtEquity(), "head")}
      <div class="pl-sub">${row("　資本金", m.capital)}${row("　利益剰余金", m.retained)}</div></div>`;
  return `<div class="mgmt-stmts">${pl}${bs}</div>`; }

    { t: `研究者を採用する（+1名）`, d: `研究能力↑（翌期から）。採用コスト ${yen(MGMT.hireCost)}・以後の人件費増。`, cost: [["採用コスト", "cost"], ["能力↑", "pos"], ["人件費↑", "neg"]],
